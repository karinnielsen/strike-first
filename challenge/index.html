<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike First: You've been challenged!</title>
<!-- Where a challenge link lands. It exists for its preview card: a chat
     app reads these tags without running the page, and the game's own page
     can't tell a challenge from any other visit. A visitor is forwarded to
     the game with the same ?vs=, which is what loads the challenge. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="🐍 Strike First: You've been challenged!">
<meta property="og:description" content="Pick a dojo, beat their score, earn your belt, challenge them back.">
<meta property="og:url" content="https://karinnielsen.github.io/strike-first/challenge/">
<meta property="og:image" content="https://karinnielsen.github.io/strike-first/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Strike First cobra crest beside a game board, with a snake wearing an orange belt, a mouse and an egg.">
<!-- Slack shows a card whole only when twitter:image is there beside the
     card type; with og:image alone it crops the middle into a thumbnail. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://karinnielsen.github.io/strike-first/og-image.png">
<meta name="twitter:title" content="🐍 Strike First: You've been challenged!">
<meta name="twitter:description" content="Pick a dojo, beat their score, earn your belt, challenge them back.">
<script>location.replace('../' + location.search + location.hash);</script>
<style>
  body { margin: 0; background: #09090b; color: #ece6da;
         font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
  a { color: inherit; }
  p { margin: 40vh 0 0; text-align: center; }
</style>
</head>
<body>
<p><a href="../">Play Strike First</a></p>
</body>
</html>
