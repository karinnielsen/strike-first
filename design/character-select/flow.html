<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter select flow</title>
<!--
  UNR-166, plan A: dojo select, then your dojo's three fighters. A return goes
  straight to your dojo's three; back is how you change dojo. No banners: the
  picks are beats on the cards themselves, and the dojo screen turns into the
  fighter screen rather than handing over to it.

  Mock only. Placeholders stand in for Astra's portraits (UNR-167). Dojo
  select's card flip is left out; it is not what is being judged.
  Mock keys: 0 slows every beat down four times, to judge the timing.
-->
<style>
  :root {
    --bg: #09090b; --line: #2a2a30; --text: #ece6da; --dim: #8a838f;
    --yellow: #ffff00; --red: #d3262f; --yellow-deep: #7a7a00; --glow: 236, 230, 218;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .aura {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s;
    background: radial-gradient(ellipse 70% 55% at 50% 72%, rgba(var(--glow), 0.16), transparent 70%);
  }
  .aura.on { opacity: 1; }

  /* The corner keycaps, as in the game: back top-left, sound top-right with
     mercy's slot kept empty beside it. */
  .hud { position: fixed; top: 16px; left: 16px; z-index: 3; display: flex; gap: 8px; }
  .hud.right { left: auto; right: 16px; }
  .hud[hidden] { display: none; }
  .hud button {
    all: unset; width: 44px; height: 44px; display: grid; place-items: center;
    color: var(--text); fill: currentColor; background: var(--line);
    border-radius: 6px; box-shadow: 0 4px 0 #0e0e11; cursor: pointer;
  }
  .hud button:hover { background: #34343b; color: var(--yellow); }
  .hud button:active { transform: translateY(4px); box-shadow: 0 0 0 #0e0e11; }
  .hud .slot { width: 44px; height: 44px; }
  #sound-btn .off, #sound-btn.muted .on { display: none; }
  #sound-btn.muted .off { display: block; }

  .screen { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; padding: 24px; }
  .screen[hidden] { display: none; }
  #select { gap: 64px; }
  .heading { display: grid; justify-items: center; gap: 20px; }
  /* The dojo line keeps its room on dojo select too, so the heading never
     moves when the screen turns. */
  .dojo-line {
    margin: 0; height: 20px; display: flex; align-items: center; gap: 10px;
    font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: rgb(var(--glow));
  }
  .dojo-line .badge { width: 18px; height: 18px; }
  .dojo-line .badge img { display: block; width: 18px; height: 18px; image-rendering: pixelated; }
  h2 {
    margin: 0; font-size: clamp(30px, 4.6vw, 52px); font-weight: bold; letter-spacing: .16em;
    color: var(--yellow); text-transform: uppercase;
    text-shadow: 0 5px 0 var(--yellow-deep), 0 0 28px rgba(255, 255, 0, .3);
  }
  .count { font-size: 44px; font-weight: bold; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .count.late { color: var(--red); text-shadow: 0 0 16px rgba(211, 38, 47, .6); }
  .how { margin: 0; font-size: 14px; letter-spacing: .5px; min-height: 1.3em; }
  .how kbd { font: inherit; font-weight: bold; }

  /* One frame, not three lit borders: it slides to the card you are on, the
     way a fighting game's cursor does. The glow is the lit card's colour. */
  .stage { position: relative; }
  .row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, auto); gap: 32px; }
  .card { color: var(--text); cursor: pointer; transition: color .12s; }
  .card .face { display: grid; justify-items: center; gap: 18px; padding: 21px 20px; }
  .card .art { width: 160px; height: 160px; filter: brightness(.4) grayscale(.6); transition: filter .12s; }
  .card .art > * { display: block; width: 100%; height: 100%; }
  .card .name { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; }
  .card.on { color: rgb(var(--c)); }
  .card.on .art { filter: none; }
  .cursor {
    position: absolute; left: 0; top: 0; pointer-events: none;
    border: 3px solid rgb(var(--c)); border-radius: 12px;
    box-shadow: 0 0 32px rgba(var(--c), .4), inset 0 0 22px rgba(var(--c), .14);
    transition: transform .14s cubic-bezier(.2, .8, .2, 1), width .14s, height .14s,
                border-color .14s, box-shadow .14s;
  }
  .cursor.still { transition: none; }
  .cursor[hidden] { display: none; }

  .flyer { position: fixed; z-index: 4; pointer-events: none; transform-origin: 0 0; }

  .stub { gap: 20px; }
  .stub p { margin: 0; }
  .stub .big { font-size: 28px; letter-spacing: 3px; text-transform: uppercase; color: rgb(var(--glow)); }
  .note { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: var(--dim); z-index: 3; }
  .note kbd { font: inherit; color: var(--text); }
</style>
</head>
<body>
<div class="aura" id="aura"></div>
<div class="hud" id="back-hud" hidden><button id="back" type="button" aria-label="back"><svg viewBox="0 0 10 10" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="4" width="8" height="2"/><rect x="2" y="3" width="1" height="4"/><rect x="3" y="2" width="1" height="6"/><rect x="4" y="1" width="1" height="8"/></svg></button></div>
<div class="hud right"><button id="sound-btn" type="button" aria-label="sound"><svg class="on" viewBox="0 0 11 10" width="22" height="20" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="3" width="2" height="4"/><rect x="2" y="2" width="1" height="6"/><rect x="3" y="1" width="1" height="8"/><rect x="4" y="0" width="1" height="10"/><rect x="6" y="3" width="1" height="4"/><rect x="8" y="1" width="1" height="2"/><rect x="9" y="3" width="1" height="4"/><rect x="8" y="7" width="1" height="2"/></svg><svg class="off" viewBox="0 0 11 10" width="22" height="20" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="3" width="2" height="4"/><rect x="2" y="2" width="1" height="6"/><rect x="3" y="1" width="1" height="8"/><rect x="4" y="0" width="1" height="10"/><rect x="6" y="3" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="9" y="3" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg></button><span class="slot"></span></div>

<section class="screen stub" id="title">
  <h2>Strike First</h2>
  <p class="how"><kbd>enter</kbd> Arcade</p>
</section>

<section class="screen" id="select" hidden>
  <div class="heading">
    <p class="dojo-line" id="dojo-line"><span class="badge"></span><span class="dname"></span></p>
    <h2 id="heading"></h2>
    <div class="count" id="count"></div>
  </div>
  <div class="stage"><ul class="row" id="row"></ul><div class="cursor" id="cursor" hidden></div></div>
  <p class="how" id="how"></p>
</section>

<section class="screen stub" id="run" hidden>
  <p class="how">the run starts, as</p>
  <p class="big" id="run-who"></p>
  <p class="how"><kbd>enter</kbd> Main menu, then Arcade again</p>
</section>

<p class="note" id="note"></p>

<script>
const DOJOS = [
  { id: 'cobra-kai',  name: 'Cobra Kai',  glow: '255, 255, 0' },
  { id: 'miyagi-do',  name: 'Miyagi-Do',  glow: '211, 38, 47' },
  { id: 'eagle-fang', name: 'Eagle Fang', glow: '236, 230, 218' }
];
const SECONDS = 30;
const HOW = '<kbd>&larr; &rarr;</kbd> or <kbd>tab</kbd> to choose &middot; <kbd>enter</kbd> to bow in';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

// Every beat, in ms, in one place, so the timing can be tuned by eye.
const BEAT = {
  chamber: 110,   // the card draws back
  hitstop: 90,    // the held frame at impact
  clear:   180,   // the other cards step away
  fly:     380,   // the crest flies up into the dojo line
  deal:    240,   // one fighter card landing
  stagger: 60,    // between cards landing
  hold:    220,   // the picked fighter, held before the run
  leave:   220    // the screen goes
};
let slow = 1;     // 0 toggles 4, to watch the beats
const t = (ms) => ms * slow;

const HAIR = [
  '<rect x="10" y="4" width="12" height="3"/><rect x="9" y="6" width="2" height="4"/><rect x="21" y="6" width="2" height="4"/>',
  '<rect x="11" y="2" width="10" height="3"/><rect x="10" y="4" width="12" height="3"/><rect x="14" y="0" width="4" height="3"/>',
  '<rect x="10" y="5" width="12" height="2"/><rect x="8" y="6" width="3" height="9"/><rect x="21" y="6" width="3" height="9"/>'
];
const bust = (glow, n) => `<svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">
  <g fill="#7b7480"><rect x="10" y="5" width="12" height="13"/><rect x="13" y="18" width="6" height="3"/><rect x="4" y="21" width="24" height="11"/><rect x="6" y="20" width="20" height="1"/></g>
  <g fill="#2a2a30">${HAIR[n]}<rect x="12" y="13" width="3" height="1"/><rect x="17" y="13" width="3" height="1"/></g>
  <rect x="10" y="8" width="12" height="2" fill="rgb(${glow})"/><rect x="13" y="21" width="6" height="11" fill="rgb(${glow})"/></svg>`;
const crest = (d) => `<img alt="" src="../../assets/crests/${d.id}.webp">`;
const fname = (n) => `Fighter ${n + 1}`;

const mem = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
};

const $ = (id) => document.getElementById(id);
const rowEl = $('row'), cursorEl = $('cursor'), lineEl = $('dojo-line');
// 'title', 'dojo', 'fighter', 'run'; busy while a beat is playing.
let screen = 'title', at = 0, dojo = 0, left = 0, timer = 0, busy = false;

const wait = (ms) => new Promise(r => setTimeout(r, ms));
function play(el, frames, ms, easing = 'ease-out', extra = {}) {
  if (REDUCED.matches || !el.animate) return Promise.resolve();
  return el.animate(frames, { duration: t(ms), easing, fill: 'both', ...extra }).finished;
}
function clearAnims(root) {
  for (const el of [root, ...root.querySelectorAll('*')]) el.getAnimations && el.getAnimations().forEach(a => a.cancel());
}

function setGlow(g) { document.documentElement.style.setProperty('--glow', g); }
function cards() { return [...rowEl.children]; }

// ---- the cursor ----
function light(i, jump) {
  if (busy && !jump) return;
  at = i;
  const list = cards();
  list.forEach((li, j) => li.classList.toggle('on', j === i));
  const li = list[i];
  if (screen === 'dojo') setGlow(DOJOS[i].glow);
  cursorEl.style.setProperty('--c', li.style.getPropertyValue('--c'));
  cursorEl.classList.toggle('still', !!jump);
  cursorEl.style.width = li.offsetWidth + 'px';
  cursorEl.style.height = li.offsetHeight + 'px';
  cursorEl.style.transform = `translate(${li.offsetLeft}px, ${li.offsetTop}px)`;
  if (jump) { void cursorEl.offsetWidth; cursorEl.classList.remove('still'); }
}

function fill(kind) {
  const d = DOJOS[dojo];
  rowEl.innerHTML = kind === 'dojo'
    ? DOJOS.map(x => `<li class="card" style="--c:${x.glow}"><div class="face"><div class="art">${crest(x)}</div><div class="name">${x.name}</div></div></li>`).join('')
    : [0, 1, 2].map(n => `<li class="card" style="--c:${d.glow}"><div class="face"><div class="art">${bust(d.glow, n)}</div><div class="name">${fname(n)}</div></div></li>`).join('');
  cards().forEach((li, i) => {
    li.addEventListener('mousemove', () => { if (i !== at) light(i); });
    li.addEventListener('click', () => { light(i); pick(false); });
  });
}

function setLine(show) {
  const d = DOJOS[dojo];
  lineEl.querySelector('.badge').innerHTML = `<img alt="" src="badges/${d.id}.svg">`;
  lineEl.querySelector('.dname').textContent = d.name;
  lineEl.style.visibility = show ? 'visible' : 'hidden';
}

// ---- the clock ----
function startClock() {
  clearInterval(timer);
  left = SECONDS; tick();
  timer = setInterval(() => { left -= 1; tick(); if (left <= 0) pick(true); }, 1000);
}
function tick() { $('count').textContent = left; $('count').classList.toggle('late', left <= 5); }

// ---- screens ----
function showOnly(id) {
  for (const s of ['title', 'select', 'run']) $(s).hidden = s !== id;
  $('aura').classList.toggle('on', id === 'select');
  $('back-hud').hidden = id !== 'select';
}

// Fighter cards land one after another, from just below, as if dealt.
async function deal() {
  cursorEl.hidden = true;
  const list = cards();
  list.forEach(li => li.style.opacity = 0);
  await Promise.all(list.map((li, i) => {
    li.style.opacity = '';
    return play(li, [{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'none' }],
      BEAT.deal, 'cubic-bezier(.2, .8, .2, 1)', { delay: t(i * BEAT.stagger) });
  }));
  list.forEach(li => li.getAnimations().forEach(a => a.cancel()));
  cursorEl.hidden = false;
  light(at, true);
  await play(cursorEl, [{ opacity: 0 }, { opacity: 1 }], 120);
  cursorEl.getAnimations().forEach(a => a.cancel());
}

async function openDojo(fromTitle) {
  busy = true;
  if (fromTitle) await play($('title'), [{ opacity: 1 }, { opacity: 0 }], 260, 'ease-in');
  clearAnims($('title'));
  screen = 'dojo';
  showOnly('select');
  setLine(false);
  $('heading').textContent = 'Choose your dojo';
  $('how').innerHTML = HOW;
  fill('dojo');
  const had = mem.get('dojo');
  at = had === null ? Math.floor(Math.random() * 3) : Number(had);
  setGlow(DOJOS[at].glow);
  startClock();
  await deal();
  busy = false;
}

async function openFighters(fromTitle) {
  busy = true;
  if (fromTitle) await play($('title'), [{ opacity: 1 }, { opacity: 0 }], 260, 'ease-in');
  clearAnims($('title'));
  screen = 'fighter';
  showOnly('select');
  setGlow(DOJOS[dojo].glow);
  setLine(true);
  $('heading').textContent = 'Choose your fighter';
  $('how').innerHTML = HOW;
  fill('fighter');
  const had = mem.get('fighter');
  at = had !== null && Math.floor(had / 3) === dojo ? Number(had) % 3 : Math.floor(Math.random() * 3);
  startClock();
  await deal();
  busy = false;
}

// The pick lands like a kick, on the card itself:
//   chamber  the card draws back and brightens
//   impact   a held frame; the frame flares; the others step away
// then, for a dojo, the screen turns into the fighter screen; for a fighter,
// the run begins.
async function strike(timedOut) {
  const li = cards()[at];
  const others = cards().filter((_, j) => j !== at);
  if (timedOut) $('how').textContent = 'Too slow. Sensei chose for you.';
  await play(li, [{ transform: 'none', filter: 'none' }, { transform: 'scale(.94)', filter: 'brightness(1.35)' }],
    BEAT.chamber, 'cubic-bezier(.3, 0, .2, 1)');
  play(li, [{ transform: 'scale(1.03)', filter: 'brightness(2.2)' }, { transform: 'none', filter: 'none' }], BEAT.hitstop + 160, 'ease-out');
  play(cursorEl, [{ boxShadow: '0 0 60px rgba(var(--c), .9), inset 0 0 40px rgba(var(--c), .5)' }, {}], BEAT.hitstop + 200, 'ease-out');
  others.forEach(o => play(o, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(14px)' }], BEAT.clear, 'ease-in'));
  await wait(t(BEAT.hitstop));
}

async function pick(timedOut) {
  if (busy || (screen !== 'dojo' && screen !== 'fighter')) return;
  busy = true;
  clearInterval(timer);
  await strike(timedOut);
  if (screen === 'dojo') return turnToFighters();
  const n = at;
  mem.set('fighter', dojo * 3 + n);
  await wait(t(BEAT.hold));
  await play($('select'), [{ opacity: 1 }, { opacity: 0 }], BEAT.leave, 'ease-in');
  clearAnims($('select'));
  screen = 'run';
  showOnly('run');
  $('run-who').textContent = `${fname(n)} · ${DOJOS[dojo].name}`;
  busy = false;
}

// Dojo select becomes fighter select: the chosen crest flies up and lands as
// the badge in the dojo line, the heading changes its word in place, and the
// dojo's three are dealt where the crests were.
async function turnToFighters() {
  dojo = at;
  mem.set('dojo', dojo);
  const art = cards()[at].querySelector('.art');
  const from = art.getBoundingClientRect();
  setLine(true);
  const badge = lineEl.querySelector('.badge');
  const to = badge.getBoundingClientRect();
  lineEl.style.visibility = 'hidden';

  const flyer = document.createElement('div');
  flyer.className = 'flyer';
  flyer.innerHTML = crest(DOJOS[dojo]);
  Object.assign(flyer.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
  flyer.firstChild.style.cssText = 'display:block;width:100%;height:100%';
  document.body.append(flyer);
  cursorEl.hidden = true;
  rowEl.style.visibility = 'hidden';

  const s = to.width / from.width;
  const fly = play(flyer, [
    { transform: 'none', opacity: 1 },
    { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${s})`, opacity: 1, offset: .85 },
    { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${s})`, opacity: 0 }
  ], BEAT.fly, 'cubic-bezier(.6, 0, .15, 1)');
  const h = $('heading');
  const word = play(h, [{ opacity: 1 }, { opacity: 0 }], 110, 'ease-in').then(() => {
    h.textContent = 'Choose your fighter';
    return play(h, [{ opacity: 0 }, { opacity: 1 }], 160);
  });
  // The name arrives as the crest lands, wiping in from the badge.
  await wait(t(BEAT.fly * .7));
  lineEl.style.visibility = 'visible';
  play(badge, [{ opacity: 0 }, { opacity: 1 }], 80);
  play(lineEl.querySelector('.dname'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], 220, 'cubic-bezier(.2, .8, .2, 1)');
  await Promise.all([fly, word]);
  flyer.remove();
  clearAnims($('select'));

  screen = 'fighter';
  $('how').innerHTML = HOW;
  fill('fighter');
  rowEl.style.visibility = '';
  const had = mem.get('fighter');
  at = had !== null && Math.floor(had / 3) === dojo ? Number(had) % 3 : Math.floor(Math.random() * 3);
  startClock();
  await deal();
  busy = false;
}

// Back from your dojo's three: they step away, and the dojos are dealt again.
async function back() {
  if (busy || screen !== 'fighter') {
    if (!busy && screen === 'dojo') { clearInterval(timer); screen = 'title'; showOnly('title'); }
    return;
  }
  busy = true;
  clearInterval(timer);
  cursorEl.hidden = true;
  await Promise.all([
    ...cards().map(li => play(li, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(14px)' }], 160, 'ease-in')),
    play(lineEl, [{ opacity: 1 }, { opacity: 0 }], 160, 'ease-in')
  ]);
  clearAnims($('select'));
  busy = false;
  openDojo(false);
}
$('back').addEventListener('click', back);

function arcade() {
  const had = mem.get('dojo');
  if (had === null) return openDojo(true);
  dojo = Number(had);
  openFighters(true);
}

const soundBtn = $('sound-btn');
const mute = () => soundBtn.classList.toggle('muted');
soundBtn.addEventListener('click', mute);

function note() {
  $('note').innerHTML = `plan A · placeholders · <kbd>0</kbd> slow motion ${slow > 1 ? 'on' : 'off'}`;
}

addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'm') return mute();
  if (k === '0') { slow = slow > 1 ? 1 : 4; return note(); }
  if (screen === 'title' || screen === 'run') {
    if (k === 'Enter') {
      if (screen === 'run') { screen = 'title'; showOnly('title'); }
      else arcade();
      e.preventDefault();
    }
    return;
  }
  if (k === 'Escape') back();
  else if (k === 'Enter' || k === ' ') pick(false);
  else if (busy) return;
  else if (k === 'ArrowLeft' || k === 'a') light((at + 2) % 3);
  else if (k === 'ArrowRight' || k === 'd') light((at + 1) % 3);
  else if (k === 'Tab') light((at + (e.shiftKey ? 2 : 1)) % 3);
  else return;
  e.preventDefault();
});

note();
showOnly('title');
</script>
</body>
</html>
