<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share images</title>
<!--
  Renders og-image.png and apple-touch-icon.png from the game itself, so
  they never drift from it. Nothing here is shipped; only the PNGs are.

  1. Serve the repo root:  python3 -m http.server 8765
  2. Run a receiver that accepts PUT /og-image.png and /apple-touch-icon.png
     on 127.0.0.1:8799 and writes them to the repo root (any ten-line
     http.server handler will do - it is not kept in the repo). It must
     allow the Content-Type header in its CORS preflight.
  3. Open http://localhost:8765/design/share/card.html and press Save.

  The board is STAGED rather than played, so the card is identical every
  time it is built and all three roles are on it at once.
-->
<style>
  body { margin: 0; padding: 24px; background: #1b1b1f; color: #ece6da;
         font: 13px ui-monospace, Menlo, monospace; }
  h2 { font-size: 13px; font-weight: normal; color: #ffff00; margin: 32px 0 8px; }
  p { color: #7b7480; margin: 0 0 8px; }
  canvas { display: block; }
  .chat { width: 500px; height: auto; border-radius: 12px; }
  .pair { display: flex; gap: 24px; flex-wrap: wrap; }
  iframe { position: absolute; left: -9999px; width: 700px; height: 1000px; border: 0; }
</style>
</head>
<body>
<button id="save">Save the chosen card and the icon</button> <span id="status"></span>

<h2>A — crest only (current)</h2>
<p>Actual size, 1200×630.</p>
<canvas id="og-a" width="1200" height="630"></canvas>

<h2>B — crest and a line saying what it is</h2>
<p>Actual size, 1200×630.</p>
<canvas id="og-b" width="1200" height="630"></canvas>

<h2>Both as a chat app shows them, about 500px wide</h2>
<p>Scaled equally, so the comparison holds — this is the size most people meet it at.</p>
<div class="pair">
  <img class="chat" id="chat-a" alt="">
  <img class="chat" id="chat-b" alt="">
</div>

<h2>Home-screen icon</h2>
<canvas id="icon" width="180" height="180"></canvas>

<iframe id="game"></iframe>

<script>
// Which card Save writes. Flip once one is chosen.
const CHOSEN = 'og-b';

// The line on card B. Same words as the page description, so the card and
// the text beside it never disagree.
// Two lines, because one at a readable size is wider than the left half.
const TAGLINE = ['Snake, as a dojo.', 'Play it in your browser.'];

// A held best score, so the snake wears a belt. 28 is orange: warm, on-brand,
// and not red, which would read as a loss.
localStorage.setItem('strikeFirstBest', '28');

const STAGE = `
  phase = 'ready';
  snake = [{x:12,y:6},{x:11,y:6},{x:10,y:6},{x:9,y:6},{x:8,y:6},{x:8,y:7},{x:8,y:8},
           {x:8,y:9},{x:9,y:9},{x:10,y:9},{x:11,y:9},{x:12,y:9},{x:13,y:9},{x:13,y:10},
           {x:13,y:11},{x:13,y:12}];
  direction = {x:1, y:0};
  egg = {x:16, y:14};
  visitor = {kind:'mouse', x:16, y:6, life:999, facing:-1};
  score = 23;
  draw();
`;

const image = src => new Promise((ok, fail) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = fail;
  img.src = src;
});
const svgUrl = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

// One card. The only difference between A and B is the line: the board and
// the crest's size are identical, and the crest rises just enough to keep
// the crest-plus-line group centred on the left half.
function drawCard(ctx, crest, board, tagline) {
  ctx.fillStyle = '#09090b';
  ctx.fillRect(0, 0, 1200, 630);

  const cw = 520, ch = cw * 360 / 1000, cx = 40;
  const lineSize = 30, leading = 42, gap = 32;
  const groupH = tagline ? ch + gap + leading * (tagline.length - 1) + lineSize : ch;
  const top = (630 - groupH) / 2;
  ctx.drawImage(crest, cx, top, cw, ch);

  if (tagline) {
    // The game's monospace, in bone: quiet next to the crest, which is the
    // one loud voice.
    ctx.font = `${lineSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    ctx.fillStyle = '#ece6da';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    tagline.forEach((line, i) =>
      ctx.fillText(line, cx + cw / 2, top + ch + gap + i * leading));
  }

  const size = 540, bx = 620, by = 45;
  ctx.drawImage(board, bx, by, size, size);
  ctx.strokeStyle = '#2a2a30';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx - 1, by - 1, size + 2, size + 2);
}

const frame = document.getElementById('game');
frame.onload = async () => {
  const win = frame.contentWindow, doc = frame.contentDocument;
  // The game finishes starting up after load, and its own opening draw
  // would paint over an early staging - so wait, then stage and draw in
  // the same breath as the copy below.
  await new Promise(r => setTimeout(r, 1000));
  win.eval(STAGE);

  const crest = await image(svgUrl(doc.querySelector('h1.crest svg').outerHTML));
  const board = doc.getElementById('game');
  for (const [id, line] of [['og-a', null], ['og-b', TAGLINE]]) {
    const c = document.getElementById(id);
    drawCard(c.getContext('2d'), crest, board, line);
    document.getElementById('chat-' + id.slice(-1)).src = c.toDataURL('image/png');
  }

  const icon = document.getElementById('icon').getContext('2d');
  icon.fillStyle = '#09090b';
  icon.fillRect(0, 0, 180, 180);
  icon.drawImage(await image('../../favicon.svg'), 0, 0, 180, 180);

  document.getElementById('status').textContent = 'ready';
};
frame.src = '../../index.html';

const put = (id, name) => new Promise(ok =>
  document.getElementById(id).toBlob(blob =>
    fetch('http://127.0.0.1:8799/' + name, { method: 'PUT', body: blob }).then(ok)));

document.getElementById('save').onclick = async () => {
  await put(CHOSEN, 'og-image.png');
  await put('icon', 'apple-touch-icon.png');
  document.getElementById('status').textContent = 'saved';
};
</script>
</body>
</html>
