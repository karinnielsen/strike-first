<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike First</title>
<!-- What the link looks like when it is pasted somewhere. Chat apps only
     fetch preview images from an absolute URL, so these point at the
     published address even before it exists. The images are rendered from
     the game itself by design/share/card.html. -->
<meta name="description" content="Snake, as a dojo. Eat eggs, chase mice, dodge rotten ones and earn your belt. Plays in the browser, nothing to install.">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Strike First">
<meta property="og:title" content="Strike First">
<meta property="og:description" content="Snake, as a dojo. Eat eggs, chase mice, dodge rotten ones and earn your belt.">
<meta property="og:url" content="https://karinnielsen.github.io/strike-first/">
<meta property="og:image" content="https://karinnielsen.github.io/strike-first/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Strike First cobra crest and the line &quot;Snake, as a dojo. Play it in your browser.&quot; beside a game board, with a snake wearing an orange belt, a mouse and an egg.">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg:     #09090b;   /* the mat, at night          */
    --panel:  #131316;   /* the board itself           */
    --line:   #2a2a30;
    --text:   #ece6da;   /* bone                       */
    --dim:    #7b7480;
    --yellow: #ffff00;   /* the dojo's own yellow: reward, and the
                            one thing the screen is asking you to do.
                            Rank is --belt and has never been this. */
    --red:    #d3262f;   /* points lost, always beside a minus */
    --brand:  #ee3524;   /* the wordmark, hotter than the gameplay red */
    --bone:   #e8e2d6;   /* the cobra                  */
    --yellow-deep: #7a7a00; /* the shadow side of it    */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* iPad Safari's 100vh is the height with its toolbar hidden, up to
       70pt more than you can see, so centring against it pushed the foot
       of the page off the bottom and made a page that fits scroll. svh is
       the height you actually get, and it holds still when the toolbar
       comes and goes. vh first, for browsers without svh. */
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .wrap { padding: 24px; }

  header { margin-bottom: 16px; }

  /* The wordmark is a drawn lockup: cobra above and through the words,
     lettering outlined into the artwork. That is why there is no display
     font here any more, and no gradient clipped to live text - the one
     loud voice is now in the drawing itself, and everything else in the
     game keeps the monospace. */
  h1.crest {
    /* Still load-bearing: the floating +N rises 24px out of the score
       counter, so the artwork has to stay clear of it. Measured at 68px
       gap, which leaves 44px spare at the popup's highest point. */
    margin: 0 0 68px;
    font-size: 0;      /* the art sets the height; no stray line box */
    line-height: 0;
  }

  h1.crest svg {
    display: block;
    margin: 0 auto;
    width: min(100%, 400px);
    height: auto;      /* 1000x360 viewBox, so 400x144 at full size */
  }

  /* Pushed to the outer edges of the board rather than huddled together. */
  /* Two clusters rather than four evenly spread items, because these are
     two kinds of thing. Score and level are LIVE - they move while you
     play. Best and rank are STANDING - they are what you hold, and a bad
     run cannot take them away. Spacing them equally would have implied
     four things of one kind.

     Every item reads label then value - score 0, level 1, hi-score 53,
     belt GREEN - so the row has one grammar rather than three.

     "hi-score" rather than "high score" is the arcade string, and it is
     also what buys the room for the word "belt": measured at the top
     rank, "high score" plus an explicit belt label exactly fills the row
     with nothing between the clusters. */
  .scores {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--dim);
  }
  .scores .group { display: flex; gap: 20px; }
  .scores b { color: var(--text); font-size: 15px; }

  /* The swatch sits on `best` rather than in a column of its own, because
     your best score is literally what produces your rank. Putting them
     together makes the causal link visible without a tutorial, and it is
     the same swatch that rides on the snake - which is what closes the
     loop between "my snake has an orange block" and "I am an orange belt". */
  .rank { display: inline-flex; align-items: center; gap: 6px; }
  .belt-swatch {
    width: 16px;
    height: 5px;
    border-radius: 1px;
    background: var(--belt, var(--bone));
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
  }

  /* The rank IN WORDS, always on screen rather than only at the moment of
     promotion. This is the signal that isn't colour: roughly one man in
     twelve cannot separate the brown and red belts, and those two are
     consecutive ranks - so without the name, the promotion someone most
     wants to see is the one they can't. The swatch stays the quick read
     for everyone else; the name is what makes it unambiguous. */
  .rank em {
    font-style: normal;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* The span has to be "relative" so the floating +N can be positioned
     against it rather than against the whole page. */
  .scores span { position: relative; }

  /* inline-block, otherwise a scale() transform has nothing to scale. */
  #score { display: inline-block; }

  /* The little number that floats up out of the score. */
  .score-pop {
    position: absolute;
    left: 50%;
    bottom: 100%;                    /* sit directly above the counter */
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;            /* never let it block a click */
    color: var(--bone);              /* bone: a routine gain */
    animation: float-up 900ms ease-out forwards;
  }

  /* A mouse is worth five times an egg, so its +5 arrives bigger and in
     the dojo's yellow. The size difference IS the message. */
  .score-pop.big { font-size: 21px; color: var(--yellow); }

  /* Red is reserved for LOSING points, and nothing else - so the moment we
     add something that costs you, it reads as bad without explanation. */
  .score-pop.minus { color: var(--red); }

  @keyframes float-up {
    0%   { opacity: 0; transform: translate(-50%,   6px) scale(0.8); }
    15%  { opacity: 1; transform: translate(-50%,   0px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -24px) scale(1);   }
  }

  /* The counter itself gives a quick squash, so the eye is pulled to the
     number even if you missed the +N drifting past. */
  #score.bump { animation: bump 260ms ease-out; }

  @keyframes bump {
    0%   { transform: scale(1);    }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1);    }
  }

  /* .stage is the positioning parent so the overlay can sit on top of the canvas */
  .stage {
    position: relative;
    /* The board is where you swipe to steer, so the browser must not treat
       a swipe as a scroll, a bounce or a zoom. Only here: the rest of the
       page still scrolls normally. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* MERCY FOR FINGERS. A tablet has no space bar, so it gets a button - in
     the header rather than on the board, because nothing may cover the
     board while a run is live. It sits at the right-hand end of the gap
     under the crest: the floating +N rises out of the score on the LEFT,
     so the two can never meet, and the crest is 400px wide and centred,
     so it never reaches this far. Touch screens only; a keyboard already
     has space. 44px because that is a finger, not a cursor. */
  .scores { position: relative; }
  .mercy-btn {
    position: absolute;
    right: 0;
    bottom: calc(100% + 12px);
    width: 44px;
    height: 44px;
    margin: 0;
    padding: 0;
    display: grid;
    grid-auto-flow: column;
    place-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: none;
    animation: none;
  }
  .mercy-btn[hidden] { display: none; }
  .mercy-btn:hover  { background: transparent; }
  .mercy-btn:active { transform: none; box-shadow: none; background: var(--line); }
  .mercy-btn i { width: 4px; height: 16px; border-radius: 1px; background: var(--dim); }

  canvas {
    display: block;
    background: var(--panel);
    /* Lighter than --line: against the mat, a --line border left the board
       with no visible edge. */
    border: 1px solid #4b4652;
    border-radius: 10px;
  }

  .overlay {
    position: absolute;
    inset: 1px;          /* inside the border, which it used to darken away */
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    border-radius: 9px;
    background: rgba(9, 9, 11, 0.9);
  }

  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 22px; letter-spacing: 3px; color: var(--yellow); }
  .overlay p  { margin: 0; font-size: 13px; color: var(--dim); }

  /* The sound switch sits under the call to action and must not compete
     with it: one slab on the overlay, and this is plain text beside it.
     It lives on the overlay rather than in the header because the header's
     spare room is load-bearing (see the +N), and because the overlay is
     the one place a tablet can reach mid-run - mercy brings it up. 44px
     tall on the same grounds as the mercy button: a finger, not a cursor. */
  .sound-btn {
    justify-self: center;
    min-height: 44px;
    margin-top: 4px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: normal;
    color: var(--dim);
    background: transparent;
    box-shadow: none;
    animation: none;
  }
  .sound-btn:hover  { background: transparent; color: var(--text); }
  .sound-btn:active { transform: none; box-shadow: none; }


  /* The one thing the screen wants you to do, so it should look like a
     button on a cabinet rather than a rectangle: a solid slab with a hard
     edge underneath, that travels when you press it.

     No blurred shadows anywhere here. The wordmark already establishes
     the language - a hard offset behind the letters plus a warm bloom
     around them - and the button rhymes with it rather than inventing a
     second treatment. */
  button {
    margin-top: 6px;
    padding: 9px 22px;
    font: inherit;
    font-size: 14px;
    font-weight: bold;     /* the overlay title above it is bold; a regular
                              weight button read as the lesser of the two,
                              which is backwards - this is the thing to do */
    letter-spacing: 0.4px;
    color: var(--bg);
    background: var(--yellow);
    border: 0;
    border-radius: 6px;
    cursor: pointer;

    /* Two shadows doing different jobs: the first is the slab's own edge,
       hard and unblurred. The second is the bloom the pulse animates. */
    box-shadow: 0 6px 0 var(--yellow-deep), 0 0 9px 1px rgba(255, 255, 0, 0.13);
    animation: cta-call 2.8s ease-in-out infinite;
  }

  button:hover { background: #ffff66; }

  /* Travels down onto its own shadow, the way a real key does. This is the
     part that makes it feel like a button rather than a link, and the
     pulse stops while you are pressing so the two never fight. */
  button:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 var(--yellow-deep);
    animation: none;
  }

  /* Keyboard users were getting whatever the browser decided. Bone rather
     than yellow, so the ring reads as separate from the button it is on. */
  button:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  /* Slow enough to be an invitation rather than a nag, but it never drops
     to nothing - a floor of 0.13 keeps the button looking lit even at the
     bottom of the cycle, so it reads as warm rather than as blinking.

     The slab edge is
     repeated in every frame because a box-shadow list animates as a whole
     - drop it from one keyframe and the button loses its edge halfway
     through the cycle. */
  @keyframes cta-call {
    0%, 100% { box-shadow: 0 6px 0 var(--yellow-deep), 0 0  9px 1px rgba(255, 255, 0, 0.13); }
    50%      { box-shadow: 0 6px 0 var(--yellow-deep), 0 0 24px 4px rgba(255, 255, 0, 0.42); }
  }

  .hint {
    margin: 12px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }

  /* THE PROMOTION MOMENT.
     It fires mid-run, at speed, at the exact moment you are playing better
     than you ever have - so it must not cover the board. A ring around the
     edge does the alerting: peripheral vision is far better at motion than
     at reading, and your eyes are locked on the snake. The board itself
     stays completely clear. */
  @keyframes promote-ring {
    0%   { box-shadow: 0 0 0 0 var(--belt), 0 0 0 0 rgba(0,0,0,0); }
    35%  { box-shadow: 0 0 0 5px var(--belt), 0 0 34px 6px var(--belt); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0), 0 0 0 0 rgba(0,0,0,0); }
  }
  .stage.promoting canvas {
    border-color: var(--belt);
    animation: promote-ring 1400ms ease-out forwards;
  }

  /* The words go BELOW the board, in the line the controls hint already
     occupies, so nothing reflows and nothing is covered. The score popup
     lives above the board, so a +5 and a promotion on the same move can
     never collide. */
  .hint.promoting {
    color: var(--belt);
    font-weight: bold;
    letter-spacing: 3px;
  }

  /* Motion has to have a way out. The ring is the part that moves; the
     colour change stays, so the moment still reads without animating.
     Doing this properly across the whole game is its own issue. */
  @media (prefers-reduced-motion: reduce) {
    .stage.promoting canvas { animation: none; box-shadow: 0 0 0 4px var(--belt); }

    /* The slab keeps its edge and its travel - those are not motion, they
       are what makes it look pressable. Only the pulse stops. */
    button { animation: none; }
  }

  .version {
    margin: 8px 0 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #4b4652;
  }

  /* SHORT WINDOWS: CREST ON TOP, BOARD AND STATS SIDE BY SIDE.
     Stacked, the page is 971px tall, so a landscape iPad (about 690 once
     Safari has its share), a laptop window and even a 1080p browser cut
     off the bottom of the board. Whenever the stacked page doesn't fit,
     the crest stays centred over everything, the board sits under it on
     the left, and the stats get a column of their own on the right as a
     list with room in it.

     Chosen by the space available, not by the device: a short laptop
     window and a landscape iPad are the same problem. Touch only decides
     input - the swipe copy and the mercy button. Tall windows keep the
     stacked page.

     When space runs short the crest gives way first, the board takes
     what is left, and nothing shrinks the stats. */
  @media (max-height: 970px) and (min-aspect-ratio: 1/1) and (min-width: 800px) {
    .wrap {
      /* Full size while the board can still have all 632px under it,
         then shrinking with the window down to 250px. Its height is 0.36
         of its width, and 680px is the board plus the padding and gap. */
      --crest-w: clamp(250px, calc((100svh - 680px) / 0.36), 400px);
      --stats-w: 240px;
      display: grid;
      grid-template-columns: auto var(--stats-w);
      grid-template-rows: auto 1fr auto auto;
      column-gap: 48px;
      padding: 16px 24px;
    }

    /* The header's two halves go to different places, so it steps aside
       and lets them be grid items in their own right. */
    header { display: contents; }

    h1.crest {
      grid-column: 1 / -1;
      grid-row: 1;
      margin: 0 0 16px;          /* the +N no longer rises this way */
    }
    h1.crest svg { width: var(--crest-w); }

    /* The board takes whatever height the crest leaves, up to full size.
       On an iPad Air that is about 555px, a 26px cell. It never goes below
       420px, 20px cells, the size the artwork was first drawn for: a
       window shorter than that scrolls rather than shrinking the board
       past where it reads. Swipes steer by distance moved, so a smaller
       board changes nothing about input. */
    .stage { grid-column: 1; grid-row: 2 / -1; }

    canvas {
      width: clamp(420px,
                   min(calc(100svh - 48px - var(--crest-w) * 0.36),
                       calc(100vw - 384px)),   /* padding, gap, stats, a scrollbar */
                   632px);
      height: auto;
    }

    /* THE STATS AS A LIST. One thing per row, label left and value right,
       and the gap between the two groups is what still says live versus
       standing. */
    .scores {
      grid-column: 2;
      grid-row: 2;
      flex-direction: column;
      justify-content: flex-start;
      gap: 36px;
      padding-top: 52px;         /* room for the +N to rise out of the top row */
    }
    .scores .group { flex-direction: column; gap: 0; }
    .scores .group span {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .scores b { font-size: 20px; }
    .scores .rank { align-items: center; }
    .rank .belt-swatch { margin-left: auto; }

    /* The value sits at the right-hand end of its row, so the +N rises
       from there rather than from the middle of the row. */
    .score-pop { left: auto; right: 0; animation-name: float-up-right; }

    /* Mercy lives at the foot of the list, full width, where a thumb
       already is. Nothing covers the board, and it is far from the +N. */
    .mercy-btn {
      order: 1;
      position: static;
      margin-top: auto;
      width: 100%;
      height: 56px;
    }

    .hint    { grid-column: 2; grid-row: 3; }
    .version { grid-column: 2; grid-row: 4; }
  }

  @keyframes float-up-right {
    0%   { opacity: 0; transform: translateY(  6px) scale(0.8); }
    15%  { opacity: 1; transform: translateY(  0px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-24px) scale(1);   }
  }
</style>
</head>

    <div class="scores">
      <button class="mercy-btn" id="mercy-btn" type="button" aria-label="mercy" hidden><i></i><i></i></button>

      <!-- Live: these move while you play. -->
      <div class="group">
        <span>score <b id="score">0</b></span>
        <span>level <b id="level">1</b></span>
      </div>

      <!-- Standing: these are what you hold, and a run cannot take them away. -->
      <div class="group">
        <span>hi-score <b id="best">0</b></span>
        <span class="rank">belt <i class="belt-swatch" id="best-belt"></i><em id="best-belt-name"></em></span>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="630" height="630"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Strike hard. No mercy.</h2>
      <p  id="overlay-text">arrows or wasd to move</p>
      <button id="play-btn">Enter the dojo</button>
      <button class="sound-btn" id="sound-btn" type="button">sound on</button>
    </div>
  </div>

  <!-- Non-breaking spaces inside each pair, so a narrow column wraps
       between controls and never splits "r" from "= restart". -->
  <p class="hint" id="hint">arrows&nbsp;/&nbsp;wasd &middot; space&nbsp;=&nbsp;mercy &middot; r&nbsp;=&nbsp;restart &middot; m&nbsp;=&nbsp;sound</p>
  <p class="version" id="version"></p>
</div>

<script>
// =====================================================================
//  1. SETUP - grab the canvas and work out the size of the grid
// =====================================================================
// A canvas is just a rectangle of pixels we can draw on. "ctx" (context)
// is the paintbrush: every shape we draw goes through it.
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

// The whole game happens on a grid of squares, not on free pixels.
// That makes collisions easy: two things collide if their x/y match.
const CELL = 30;                      // one grid square = 30 pixels
const COLS = canvas.width  / CELL;    // 21 columns across
const ROWS = canvas.height / CELL;    // 21 rows down

// Single source of truth for the version. Bump this, add a CHANGELOG entry,
// update the Current version line in README.md, and tag the commit - those
// four go together, always.
const VERSION = '0.4.1';
document.getElementById('version').textContent = 'v' + VERSION;

// Handy references to the bits of HTML we update as the game runs.
const scoreEl   = document.getElementById('score');
const levelEl   = document.getElementById('level');
const bestEl    = document.getElementById('best');
const overlay   = document.getElementById('overlay');
const titleEl   = document.getElementById('overlay-title');
const textEl    = document.getElementById('overlay-text');
const bestBeltEl = document.getElementById('best-belt');
const bestNameEl = document.getElementById('best-belt-name');
const stageEl   = document.getElementById('stage');
const hintEl    = document.getElementById('hint');
const mercyBtn  = document.getElementById('mercy-btn');
const playBtn   = document.getElementById('play-btn');
const soundBtn  = document.getElementById('sound-btn');

// Can this screen be touched? `any-pointer` rather than `pointer`, so an
// iPad with a keyboard attached still gets the swipe copy and the mercy
// button - the finger is still there even when a trackpad is too.
const TOUCH = window.matchMedia('(any-pointer: coarse)').matches;

// Instructions name the controls you actually have. A tablet has no space
// bar, so telling it to press one is worse than saying nothing.
if (TOUCH) {
  hintEl.textContent = 'swipe to move · ❚❚ = mercy';
  document.getElementById('overlay-text').textContent = 'swipe to move';
  mercyBtn.hidden = false;
}
const HINT_TEXT = hintEl.textContent;
const MERCY_TEXT = TOUCH ? 'Tap continue to fight on' : 'Press space to fight on';

// Asked once and kept, so anything that moves can check it cheaply. The
// game honours this in CSS too; doing it properly everywhere is UNR-104.
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');


// =====================================================================
//  2. STATE - every fact the game needs to remember
// =====================================================================
// If you can describe all of these, you can describe the game exactly as
// it looks at this instant. That is all "game state" means.
let snake;          // list of squares, snake[0] is the head
let direction;      // the way we ARE moving, e.g. {x:1, y:0} is right
let turnQueue;      // turns asked for but not made yet, soonest first
let egg;            // the baseline food. There is always exactly one.
let visitor;        // the second slot: a mouse or a rotten egg, or null
let grow;           // squares still owed to the snake from something eaten
let queasy;         // moves left of looking green, after a rotten egg
let bestAtStart;    // the record as it stood when this run began
let score;
let phase;          // 'ready' | 'playing' | 'paused' | 'over'

// Three foods filling three roles, and no more. The EGG is the baseline:
// always there, low value, no cost. The MOUSE is the temptation: worth
// five times as much, but it expires and it costs you extra length. The
// ROTTEN egg is the hazard: it takes points off you.
//
// Only ever two things on the board - the egg, plus at most one visitor.
// That's enforced by there being a single `visitor` slot rather than by
// anyone remembering the rule, and it keeps every decision binary: the
// egg, or the other thing. That's all you can answer at 70ms a move.
const EGG_POINTS    = 1;
const MOUSE_POINTS  = 5;
const ROTTEN_POINTS = -3;   // worth three eggs, so it stings without ruining a run

const EGG_GROWTH    = 1;
const MOUSE_GROWTH  = 2;    // Settled by play on 8 September. The whole point
                            // is that a mouse costs you something: five points
                            // for two squares is a real decision late in a run
                            // rather than pure upside. See UNR-83.

// How often a visitor turns up, and which kind it is when it does.
const VISITOR_CHANCE = 0.4;  // roughly two eggs in five bring something along
const ROTTEN_SHARE   = 0.4;  // ...and this fraction of those are rotten

// How many of YOUR MOVES a visitor sticks around for.
//
// This was cut to 45 on the arithmetic that the longest crossing is 40
// moves. Playing it showed that was wrong: 40 assumes you spot the thing
// instantly and travel in a straight line, and you do neither. Mice were
// vanishing before there was a fair chance at them.
//
// The timer is no longer what makes a mouse a decision. Reachability is
// guaranteed at spawn instead, so the cost of going for one is the extra
// length it leaves you carrying and the risk of boxing yourself in - not
// whether you happened to notice in time. Missing one should be a
// decision that went wrong, never bad luck.
const MOUSE_LIFE    = 60;
const ROTTEN_LIFE   = 45;
const WARNING_MOVES = 15;   // moves left when a visitor starts flashing

// How far a visitor may spawn from your head, as a fraction of its life.
// The rest of the budget is slack for noticing it and for the fact that
// nobody travels in a straight line.
const REACH_BUDGET  = 0.5;

// How long the snake looks ill after a rotten egg. Counted in YOUR MOVES
// like everything else, so it lasts the same number of decisions at every
// speed and doesn't tick away while the game is paused.
const QUEASY_MOVES  = 14;

// Difficulty within a run, as tiers rather than a smooth slope.
//
// This used to shave 4ms off per point, continuously. It worked, but it
// was invisible: every run felt like the same gradient and nothing ever
// happened. Steps give a run a rhythm - settle in, master a pace, get
// pushed - and give you something to notice that isn't the score.
//
// A level is within a run and resets when you die. A belt is across runs
// and is a rank you hold. They are different things and they live in
// different places: the level in the header, the belt on the snake.
//
// Level 1 opened at 200ms and playing it showed that was too brisk to
// start, especially now there are three things on the board to read
// rather than two. It opens slower and takes longer to bite.
const LEVELS = [
  { from:   0, ms: 260 },   // 1 - unhurried, room to think
  { from:   8, ms: 225 },
  { from:  18, ms: 195 },
  { from:  30, ms: 170 },
  { from:  45, ms: 145 },
  { from:  65, ms: 120 },
  { from:  90, ms: 100 },
  { from: 120, ms:  85 },
  { from: 155, ms:  70 }    // 9 - the floor. Nothing gets faster than this.
];

// Best score needed for each rank. What a belt IS, and why rank comes
// from your best score, is explained with the belt code below.
//
// THRESHOLDS ARE A STARTING SHAPE, to be corrected by play. The first
// gap is the one that matters: every player experiences white to orange
// and progressively fewer see each rank after it, so it is the
// highest-traffic decision on the whole ladder. Nobody has watched a new
// player score anything yet, so 15 is a compromise between "meet the
// mechanic before you stop playing" and "make it feel earned", not a
// finding. If new players bounce off it, lower it - that is a one-line
// change and there is no cost to being wrong in that direction.
const BELTS = [
  { name: 'White',         colour: '#e8e2d6', from:   0 },
  { name: 'Orange',        colour: '#f4761c', from:  15 },
  { name: 'Green',         colour: '#46a86c', from:  35 },
  { name: 'Brown',         colour: '#9c6438', from:  65 },
  { name: 'Red',           colour: '#d3262f', from: 110 },
  { name: 'Cho Dan Bo',    colour: '#3f7fd0', from: 175 },
  { name: 'Midnight blue', colour: '#324791', from: 275 }
];

// localStorage is the browser's tiny notepad - it survives a refresh.
// Renaming the game shouldn't cost you your record, so we still read the
// old key if the new one isn't there yet.
let best = Number(
  localStorage.getItem('strikeFirstBest') || localStorage.getItem('snakeBest') || 0
);
bestEl.textContent = best;

// Put the game back to its opening position. Called at the start and
// after every game over, so a fresh game is always identical.
function reset() {
  snake         = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  direction     = {x: 1, y: 0};   // heading right
  turnQueue     = [];
  score         = 0;
  grow          = 0;
  // Snapshot, because `best` moves during the run now. Without this there
  // is no way to ask afterwards whether THIS run beat the record.
  bestAtStart   = best;
  queasy        = 0;
  visitor       = null;
  scoreEl.textContent = score;
  levelEl.textContent = levelFor(score);
  placeEgg();
}

// Pick a random square that nothing is sitting on yet. The do/while just
// keeps re-rolling until it finds a free one.
function randomEmptySquare() {
  let spot;
  do {
    spot = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (isOccupied(spot));
  return spot;
}

function isOccupied(spot) {
  if (snake.some(part => part.x === spot.x && part.y === spot.y)) return true;
  if (egg     && egg.x     === spot.x && egg.y     === spot.y) return true;
  if (visitor && visitor.x === spot.x && visitor.y === spot.y) return true;
  return false;
}

// Pick a free square close enough that the snake could actually get there
// before the visitor leaves. A mouse parked in the far corner isn't a
// decision, it's a tease; and a rotten egg out there is neither a threat
// nor a choice. Either way the slot is wasted.
function reachableSquare(life) {
  const head   = snake[0];
  const budget = Math.floor(life * REACH_BUDGET);
  for (let tries = 0; tries < 200; tries++) {
    const spot = randomEmptySquare();
    const steps = Math.abs(spot.x - head.x) + Math.abs(spot.y - head.y);
    if (steps <= budget) return spot;
  }
  return randomEmptySquare();   // give up rather than spin forever
}

function placeEgg() {
  egg = null;                     // clear it first so it can't block itself
  egg = randomEmptySquare();
}

// Called after every egg. Most of the time nothing happens - that's what
// makes a visitor feel like an event rather than a routine.
//
// There is only one slot, so a mouse and a rotten egg can never be out at
// the same time. Every arrival is therefore the same question: is that
// worth going for, or is it going to cost me? You have to look, and
// looking away from your own head is itself the risk.
function maybeSpawnVisitor() {
  if (visitor) return;                          // the slot is taken
  if (Math.random() > VISITOR_CHANCE) return;

  const rotten = Math.random() < ROTTEN_SHARE;
  const life   = rotten ? ROTTEN_LIFE : MOUSE_LIFE;
  const spot   = reachableSquare(life);
  visitor = {
    kind:   rotten ? 'rotten' : 'mouse',
    x:      spot.x,
    y:      spot.y,
    life:   rotten ? ROTTEN_LIFE : MOUSE_LIFE,
    facing: Math.random() < 0.5 ? 1 : -1        // which way it happens to sit
  };
}


// =====================================================================
//  3. UPDATE - move the world forward by exactly one step
// =====================================================================
function update() {
  // Take the next turn the player asked for, if there's one waiting. Turns
  // are queued rather than overwritten, so a quick two-key corner survives.
  // Exactly one comes off the queue per step, which is what stops a fast
  // double-tap folding the snake back on itself.
  if (turnQueue.length) direction = turnQueue.shift();

  if (queasy > 0) queasy -= 1;

  // A visitor is on a countdown, measured in your moves rather than in
  // seconds. That keeps a mouse just as catchable at top speed as at level
  // 1, and means nothing quietly escapes while the game is paused.
  if (visitor) {
    visitor.life -= 1;
    if (visitor.life <= 0) visitor = null;   // it got bored, or it went off
  }

  // The new head is the old head, one square along in our direction.
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Did we hit a wall?
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver('wall');
  }

  // Did we hit ourselves? .some() asks "is ANY body part on this square?"
  if (snake.some(part => part.x === head.x && part.y === head.y)) {
    return gameOver('self');
  }

  // Move: add the new head to the front of the list...
  snake.unshift(head);

  // Did we land on anything? Only one of these can be true, since nothing
  // is ever placed on a square something else already occupies.
  if (head.x === egg.x && head.y === egg.y) {
    addScore(EGG_POINTS, 'egg');
    grow += EGG_GROWTH;
    placeEgg();
    maybeSpawnVisitor();        // an egg sometimes brings something with it
  } else if (visitor && head.x === visitor.x && head.y === visitor.y) {
    if (visitor.kind === 'mouse') {
      addScore(MOUSE_POINTS, 'mouse');
      grow += MOUSE_GROWTH;     // the cost: worth five, but you carry two
    } else {
      addScore(ROTTEN_POINTS, 'rotten');
      queasy = QUEASY_MOVES;    // and you have to watch yourself regret it
      // Deliberately no length change. Taking length OFF would be a
      // *relief* late in a run, which is the opposite of a punishment.
    }
    visitor = null;
  }

  // Growing is just skipping the tail removal. `grow` is how many squares
  // we still owe the snake, so a mouse worth two lengthens it over two
  // steps rather than needing a special case.
  if (grow > 0) grow -= 1;
  else snake.pop();
}

// Every point in the game goes through here, so the feedback can never
// get out of step with the number.
function addScore(points, kind) {
  // Floored at zero. A negative score would read as broken, and belt
  // thresholds are all defined upwards from nothing.
  score = Math.max(0, score + points);
  scoreEl.textContent = score;
  levelEl.textContent = levelFor(score);

  // Rank moves the INSTANT you pass your own record, not when you die.
  // That is what lets a promotion land mid-run, which is the entire point
  // of it: you are still holding the controller, still trying not to die,
  // and the game tells you that you have never been this good. Working it
  // out at gameOver() meant you found out afterwards, which is no moment
  // at all.
  //
  // Order matters here. promotionFor() is asked BEFORE best moves, because
  // the question is whether this point crossed a threshold the old best
  // had not. Afterwards the answer would always be no.
  let earned = null;
  if (score > best) {
    earned = promotionFor(best, score);
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('strikeFirstBest', best);
    showBestBelt();
    if (earned) promote(earned);
  }

  // A promotion brings its own sound, and it replaces the food's rather
  // than playing over it: two sounds at once would be neither.
  if (!earned) playSound(kind);

  // Restart the squash animation. Removing the class isn't enough on its
  // own - the browser batches up our changes and sees no difference.
  // Reading offsetWidth forces it to catch up, so the animation re-runs.
  scoreEl.classList.remove('bump');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('bump');

  // The sign decides the colour, so red can never turn up on a gain by
  // accident - the rule is enforced here rather than left to whoever
  // adds the next food type.
  const pop = document.createElement('div');
  pop.className = 'score-pop'
                + (kind === 'mouse'  ? ' big'   : '')
                + (points < 0        ? ' minus' : '');
  pop.textContent = (points < 0 ? '−' : '+') + Math.abs(points);
  scoreEl.parentElement.appendChild(pop);

  // CSS handles the drifting and fading; we just clear up afterwards.
  setTimeout(() => pop.remove(), 900);
}

function gameOver(cause) {
  phase = 'over';

  // `best` is not touched here any more. It moves the moment you pass it,
  // inside addScore(), which is what lets the promotion land while you are
  // still playing. By the time you die it is already correct.

  // This screen says one thing: you lost. A promotion is a separate
  // moment and putting it here made the screen argue with itself -
  // "DEFEATED" and "PROMOTED" are not the same news and should not
  // share a slot. The promotion lands on its own, mid-run, which is
  // where it belongs and what makes it worth having. See UNR-81.
  //
  // The score is not repeated here - it is still sitting in the header
  // where you have been watching it all run. This screen gets one thing
  // to say, so it may as well be worth reading.
  showOverlay(
    'DEFEATED',
    defeatLine(cause, score, score > bestAtStart, Math.random()),
    'Again'
  );
  playSound('defeat');
}


// ---- sound ------------------------------------------------------------
// 80s/90s arcade: square and pulse waves and a noise channel, generated
// here rather than shipped as files, so the game stays one file. Each
// sound was picked by ear from candidates in design/sound-options.html,
// which is where to audition changes before making them here.
//
// Time is counted in FRAMES, a 60th of a second, because that is how 8-bit
// sound drivers stepped: pitch and volume change on the frame and never in
// between. That stepping is most of what makes it sound arcade, so don't
// smooth it into slides.
//
// Sound is output, like draw(): it reports what update() decided and never
// decides anything itself.

const SOUND_VOLUME = 0.3;
const FRAME = 1 / 60;

// Muting is remembered, like the best score, and per-origin in the same
// way: it won't follow the game to a different address.
let muted = localStorage.getItem('strikeFirstMuted') === '1';

let audioCtx = null;   // made on the first start, never before
let audioOut, noiseBuffer;
const pulseWaves = {};

// Browsers refuse to play audio until the player has interacted with the
// page, so the context is created by startGame(), which only ever runs
// from a click or a key. Returns null where there is no Web Audio at all
// (and in the test harness), and every sound then quietly does nothing.
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    audioOut = audioCtx.createGain();
    audioOut.gain.value = muted ? 0 : SOUND_VOLUME;
    audioOut.connect(audioCtx.destination);
    for (const duty of [0.125, 0.25]) pulseWaves[duty] = pulseWave(duty);
    noiseBuffer = makeNoise();
    keepAwake();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Output hardware goes to sleep in the silence between sounds - MacBook
// speakers do it after a few seconds - and waking it swallows the start of
// the next sound. An egg blip is 50ms, so it vanished entirely: no sound at
// the start of a run, then sounds apparently at random. The fix is to never
// be silent. This hiss runs for as long as the page is open, at about
// -80dB, far below hearing and below the level at which a browser marks
// the tab as playing audio. It goes through audioOut, so muting silences
// it too, and then the hardware may sleep, which is fine.
const KEEP_AWAKE_LEVEL = 0.0001;

function keepAwake() {
  const hiss = audioCtx.createBufferSource(), gain = audioCtx.createGain();
  hiss.buffer = noiseBuffer;
  hiss.loop = true;
  gain.gain.value = KEEP_AWAKE_LEVEL / SOUND_VOLUME;
  hiss.connect(gain).connect(audioOut);
  hiss.start();
}

// A pulse wave of a given duty cycle, from its Fourier series. 50% is a
// plain square; the thinner 25% and 12.5% are the nasal sound most people
// mean by "8-bit".
function pulseWave(duty) {
  const n = 64;
  const real = new Float32Array(n), imag = new Float32Array(n);
  for (let k = 1; k < n; k++) real[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
  return audioCtx.createPeriodicWave(real, imag);
}

// One-bit noise, each value held for a few samples, which gives it the
// gritty quality of a hardware noise channel rather than a hiss.
function makeNoise() {
  const len = audioCtx.sampleRate, hold = 6;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  let v = 1;
  for (let i = 0; i < len; i++) {
    if (i % hold === 0) v = Math.random() < 0.5 ? -1 : 1;
    data[i] = v;
  }
  return buf;
}

// steps: [[frequency or null, volume, frames], ...] played in order.
// The tiny setTargetAtTime on volume takes the click off each step
// without smoothing the step itself away.
function tone(wave, steps, delayFrames = 0) {
  const t0 = audioCtx.currentTime + 0.01 + delayFrames * FRAME;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  if (wave === 'p125')     osc.setPeriodicWave(pulseWaves[0.125]);
  else if (wave === 'p25') osc.setPeriodicWave(pulseWaves[0.25]);
  else                     osc.type = wave;
  gain.gain.setValueAtTime(0, t0);
  osc.connect(gain).connect(audioOut);
  let t = t0;
  for (const [f, v, frames] of steps) {
    if (f) osc.frequency.setValueAtTime(f, t);
    gain.gain.setTargetAtTime(f ? v : 0, t, 0.002);
    t += frames * FRAME;
  }
  gain.gain.setTargetAtTime(0, t, 0.004);
  osc.start(t0);
  osc.stop(t + 0.05);
}

// steps: [[rate, volume, frames], ...]. Low rates crunch, high ones hiss.
function noise(steps) {
  const t0 = audioCtx.currentTime + 0.01;
  const src = audioCtx.createBufferSource(), gain = audioCtx.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  gain.gain.setValueAtTime(0, t0);
  src.connect(gain).connect(audioOut);
  let t = t0;
  for (const [rate, v, frames] of steps) {
    src.playbackRate.setValueAtTime(rate, t);
    gain.gain.setTargetAtTime(v, t, 0.002);
    t += frames * FRAME;
  }
  gain.gain.setTargetAtTime(0, t, 0.004);
  src.start(t0);
  src.stop(t + 0.05);
}

// Note name to frequency: note('C5'), note('F#3').
function note(name) {
  const m = name.match(/^([A-G])(#|b)?(\d)$/);
  const semis = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]]
              + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = 12 * (Number(m[3]) + 1) + semis;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

let eggsHeard = 0;

const SOUNDS = {
  // The one you hear most. A single blip, alternating between two notes a
  // fourth apart, so a long run of eggs becomes a rhythm instead of one
  // sound repeating until it grates.
  egg() {
    const f = eggsHeard++ % 2 ? note('G5') : note('C6');
    tone('square', [[f, 0.32, 2], [f, 0.12, 1]]);
  },

  // A squeak, because it was a mouse, then a two-note ding, because it
  // was worth five eggs.
  mouse() {
    tone('p125', [
      [note('E6'), 0.28, 1], [note('G6'), 0.28, 1],
      [note('E6'), 0.28, 1], [note('A6'), 0.28, 1],
    ]);
    tone('p25', [
      [note('C6'), 0.4, 3], [note('G6'), 0.4, 4],
      [note('G6'), 0.24, 4], [note('G6'), 0.1, 4],
    ], 5);
  },

  // A burp. Pitch jumps up and down every frame (the roughness) while
  // sliding down overall (running out of air), volume flutters on
  // alternate frames (the throat), and low noise crackles underneath.
  rotten() {
    const frames = 22, steps = [], crackle = [];
    let f = 120;
    for (let k = 0; k < frames; k++) {
      const swell = k < 3 ? (k + 1) / 3 : 1 - (k - 3) / frames;
      const v = (k % 2 ? 0.28 : 0.5) * swell;
      steps.push([f * (k % 2 ? 0.82 : 1.12), v, 1]);
      crackle.push([0.22 + (k % 3) * 0.07, v * 0.4, 1]);
      f *= 0.975;
    }
    tone('square', steps);
    noise(crackle);
  },

  // Fast arpeggiated chords, I-IV-V-I, landing on a high C over a
  // triangle bass. About a second: a moment, not a fanfare.
  promotion() {
    const chords = [
      [note('C5'), note('E5'), note('G5')],
      [note('F5'), note('A5'), note('C6')],
      [note('G5'), note('B5'), note('D6')],
    ];
    const steps = [];
    for (const chord of chords) {
      for (let r = 0; r < 2; r++) chord.forEach(f => steps.push([f, 0.34, 2]));
    }
    [note('C6'), note('E6'), note('G6')].forEach(f => steps.push([f, 0.36, 2]));
    steps.push([note('C7'), 0.38, 6], [note('C7'), 0.22, 6], [note('C7'), 0.1, 6]);
    tone('p25', steps);
    tone('triangle', [
      [note('C3'), 0.9, 12], [note('F2'), 0.9, 12],
      [note('G2'), 0.9, 12], [note('C3'), 0.9, 18],
    ]);
  },

  // Two octaves straight down in semitones, fading as it falls. One
  // gesture, the lose-a-life sound.
  defeat() {
    const steps = [];
    for (let k = 0; k < 24; k++) {
      steps.push([note('C5') * Math.pow(2, -k / 12), 0.42 - k * 0.013, 2]);
    }
    tone('square', steps);
  },
};

function playSound(name) {
  if (!audioCtx) return;    // nobody has pressed anything yet
  if (muted) return;
  SOUNDS[name]();
}

// The M key and the overlay's sound button share this. Changing the output
// volume as well as the flag means a sound already ringing stops at once
// rather than finishing after you asked for quiet.
function toggleSound() {
  muted = !muted;
  localStorage.setItem('strikeFirstMuted', muted ? '1' : '0');
  if (audioOut) audioOut.gain.value = muted ? 0 : SOUND_VOLUME;
  showSound();
}

function showSound() {
  soundBtn.textContent = muted ? 'sound off' : 'sound on';
  soundBtn.setAttribute('aria-pressed', String(!muted));
}


// =====================================================================
//  4. DRAW - paint the current state onto the canvas
// =====================================================================
// Note that drawing never CHANGES anything. It only shows what update()
// already decided. Keeping those two jobs separate keeps games sane.
function draw() {
  // Wipe the previous frame, otherwise we'd smear trails everywhere.
  ctx.fillStyle = '#131316';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Faint dot in the middle of each grid square, just for looks.
  ctx.fillStyle = '#1e1e24';
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
    }
  }

  // The egg, with a gentle pulse driven by the clock.
  const pulse = 1 + Math.sin(Date.now() / 200) * 0.10;
  drawEgg(egg.x * CELL + CELL / 2, egg.y * CELL + CELL / 2, pulse);

  if (visitor) {
    // Flash when it's nearly out of time, so you get fair warning either
    // way: that a mouse is about to bolt, or that a rotten one is about
    // to stop being your problem.
    const panicking = visitor.life < WARNING_MOVES;
    if (!(panicking && Math.floor(Date.now() / 140) % 2 === 0)) {
      if (visitor.kind === 'mouse') drawMouse();
      else                          drawRottenEgg();
    }
  }

  drawSnake();
}


// =====================================================================
//  5. SPRITES - the drawn artwork, as Path2D
// =====================================================================
// Commissioned rather than hand-coded, because detailed artwork is the one
// thing this project has repeatedly got wrong when drawing it in code.
//
// The board is a canvas, so an SVG file cannot be placed on it. Path2D is
// the way in: it takes SVG path data directly. Each shape is built ONCE
// here rather than per frame, because these are painted sixty times a
// second and reparsing a path string that often is pure waste.
//
// Every path is authored in a 20x20 box, the size a grid cell was when the
// artwork was commissioned, so drawing one means translating to the cell,
// scaling and filling. See design/ASSET-BRIEF.md section 7. The original
// delivered files are on the branch asset-review/board-sprites.
const SPRITE = {
  egg: [
    { fill: '#f4e8cf', d: 'M10 3.6C7.5 3.6 4.9 8.7 4.9 11.1C4.9 14.2 7 16.4 10 16.4C13 16.4 15.1 14.2 15.1 11.1C15.1 8.7 12.5 3.6 10 3.6Z' },
    { fill: 'rgba(255,255,255,0.55)', d: 'M9.7 5.3C8.5 5.5 6.8 8.5 6.5 10.6C6.4 11.3 6.8 11.7 7.2 11.3C7.7 10.8 7.6 9.7 8.3 8.2C8.8 7 9.7 6 9.7 5.3Z' }
  ],

  // The tilt is BAKED into these coordinates, about (10,11). Do not rotate
  // them again - a good egg stands upright, and the lean is what says this
  // one is wrong before you have registered the colour or the crack.
