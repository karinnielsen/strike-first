<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #09090b;   /* the mat, at night          */
    --panel:  #131316;   /* the board itself           */
    --line:   #2a2a30;
    --text:   #ece6da;   /* bone                       */
    --dim:    #7b7480;
    --gold:   #e8b53a;   /* rank, reward, the big hits */
    --red:    #d3262f;   /* blood, and losses only     */
    --brand:  #ee3524;   /* the wordmark, hotter than the gameplay red */
    --bone:   #e8e2d6;   /* the cobra                  */
    --gold-deep: #7a5810; /* the shadow side of gold    */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .wrap { padding: 24px; }

  header { margin-bottom: 16px; }

  /* The brush face belongs to the wordmark and nothing else. Everything
     in the game keeps the monospace voice, which is what lets the header
     read as a logo rather than as large text. Impact is the fallback if
     the font can't be fetched - still heavy, still shouts. */
  h1 {
    /* That bottom margin is load-bearing: the floating +N rises 24px out
       of the score counter, so the wordmark has to stay clear of it. */
    margin: 0 0 68px;
    text-align: center;
    font-family: 'Permanent Marker', Impact, Haettenschweiler, sans-serif;
    font-weight: 400;
    font-variant: small-caps;   /* big S and F, smaller letters after */
    font-size: 68px;
    line-height: 1.1;
    letter-spacing: 1px;
    color: var(--brand);        /* the fallback, if the gradient can't apply */
    transform: skewX(-11deg);   /* the forward lean */

    /* drop-shadow, not text-shadow: text-shadow paints ON TOP of a
       background-clipped gradient and would blot it out. A filter is
       applied to the finished picture instead, so the gradient survives. */
    filter: drop-shadow(0 3px 0 #6d1015)
            drop-shadow(0 0 22px rgba(238, 53, 36, 0.28));
  }

  /* Fire: red at the top burning down to yellow. The trick is to paint a
     gradient as the element's BACKGROUND, then clip it to the shape of the
     letters and make the letters themselves see-through. Wrapped in
     @supports so that on a browser that can't do it, the title stays solid
     red rather than turning invisible. */
  @supports (-webkit-background-clip: text) or (background-clip: text) {
    h1 {
      /* The stops start below 0% and finish before 100% because the line
         box is taller than the letters - a stop at 0% would be spent on
         empty space above them, and the red would barely show. */
      background: linear-gradient(180deg,
                    #ee3524 16%,
                    #f4761c 55%,
                    #f7c948 93%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  }

  /* Pushed to the outer edges of the board rather than huddled together. */
  /* Two clusters rather than four evenly spread items, because these are
     two kinds of thing. Score and level are LIVE - they move while you
     play. Best and rank are STANDING - they are what you hold, and a bad
     run cannot take them away. Spacing them equally would have implied
     four things of one kind.

     Every item reads label then value - score 0, level 1, hi-score 53,
     belt GREEN - so the row has one grammar rather than three.

     "hi-score" rather than "high score" is the arcade string, and it is
     also what buys the room for the word "belt": measured at the top
     rank, "high score" plus an explicit belt label exactly fills the row
     with nothing between the clusters. */
  .scores {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--dim);
  }
  .scores .group { display: flex; gap: 20px; }
  .scores b { color: var(--text); font-size: 15px; }

  /* The swatch sits on `best` rather than in a column of its own, because
     your best score is literally what produces your rank. Putting them
     together makes the causal link visible without a tutorial, and it is
     the same swatch that rides on the snake - which is what closes the
     loop between "my snake has an orange block" and "I am an orange belt". */
  .rank { display: inline-flex; align-items: center; gap: 6px; }
  .belt-swatch {
    width: 16px;
    height: 5px;
    border-radius: 1px;
    background: var(--belt, var(--bone));
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
  }

  /* The rank IN WORDS, always on screen rather than only at the moment of
     promotion. This is the signal that isn't colour: roughly one man in
     twelve cannot separate the brown and red belts, and those two are
     consecutive ranks - so without the name, the promotion someone most
     wants to see is the one they can't. The swatch stays the quick read
     for everyone else; the name is what makes it unambiguous. */
  .rank em {
    font-style: normal;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* The span has to be "relative" so the floating +N can be positioned
     against it rather than against the whole page. */
  .scores span { position: relative; }

  /* inline-block, otherwise a scale() transform has nothing to scale. */
  #score { display: inline-block; }

  /* The little number that floats up out of the score. */
  .score-pop {
    position: absolute;
    left: 50%;
    bottom: 100%;                    /* sit directly above the counter */
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;            /* never let it block a click */
    color: var(--bone);              /* bone: a routine gain */
    animation: float-up 900ms ease-out forwards;
  }

  /* A mouse is worth five times an egg, so its +5 arrives bigger and
     gold. The size difference IS the message. */
  .score-pop.big { font-size: 21px; color: var(--gold); }

  /* Red is reserved for LOSING points, and nothing else - so the moment we
     add something that costs you, it reads as bad without explanation. */
  .score-pop.minus { color: var(--red); }

  @keyframes float-up {
    0%   { opacity: 0; transform: translate(-50%,   6px) scale(0.8); }
    15%  { opacity: 1; transform: translate(-50%,   0px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -24px) scale(1);   }
  }

  /* The counter itself gives a quick squash, so the eye is pulled to the
     number even if you missed the +N drifting past. */
  #score.bump { animation: bump 260ms ease-out; }

  @keyframes bump {
    0%   { transform: scale(1);    }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1);    }
  }

  /* .stage is the positioning parent so the overlay can sit on top of the canvas */
  .stage { position: relative; }

  canvas {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .overlay {
    position: absolute;
    inset: 0;                              /* fill the whole stage */
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    border-radius: 10px;
    background: rgba(9, 9, 11, 0.9);
  }

  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 22px; letter-spacing: 3px; color: var(--gold); }
  .overlay p  { margin: 0; font-size: 13px; color: var(--dim); }


  /* The one thing the screen wants you to do, so it should look like a
     button on a cabinet rather than a rectangle: a solid slab with a hard
     edge underneath, that travels when you press it.

     No blurred shadows anywhere here. The wordmark already establishes
     the language - a hard offset behind the letters plus a warm bloom
     around them - and the button rhymes with it rather than inventing a
     second treatment. */
  button {
    margin-top: 6px;
    padding: 9px 22px;
    font: inherit;
    font-size: 14px;
    font-weight: bold;     /* the overlay title above it is bold; a regular
                              weight button read as the lesser of the two,
                              which is backwards - this is the thing to do */
    letter-spacing: 0.4px;
    color: var(--bg);
    background: var(--gold);
    border: 0;
    border-radius: 6px;
    cursor: pointer;

    /* Two shadows doing different jobs: the first is the slab's own edge,
       hard and unblurred. The second is the bloom the pulse animates. */
    box-shadow: 0 6px 0 var(--gold-deep), 0 0 9px 1px rgba(232, 181, 58, 0.13);
    animation: cta-call 2.8s ease-in-out infinite;
  }

  button:hover { background: #f5cd6b; }

  /* Travels down onto its own shadow, the way a real key does. This is the
     part that makes it feel like a button rather than a link, and the
     pulse stops while you are pressing so the two never fight. */
  button:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 var(--gold-deep);
    animation: none;
  }

  /* Keyboard users were getting whatever the browser decided. Bone rather
     than gold, so the ring reads as separate from the button it is on. */
  button:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  /* Slow enough to be an invitation rather than a nag, but it never drops
     to nothing - a floor of 0.13 keeps the button looking lit even at the
     bottom of the cycle, so it reads as warm rather than as blinking.

     The slab edge is
     repeated in every frame because a box-shadow list animates as a whole
     - drop it from one keyframe and the button loses its edge halfway
     through the cycle. */
  @keyframes cta-call {
    0%, 100% { box-shadow: 0 6px 0 var(--gold-deep), 0 0  9px 1px rgba(232, 181, 58, 0.13); }
    50%      { box-shadow: 0 6px 0 var(--gold-deep), 0 0 24px 4px rgba(232, 181, 58, 0.42); }
  }

  .hint {
    margin: 12px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--dim);
  }

  /* THE PROMOTION MOMENT.
     It fires mid-run, at speed, at the exact moment you are playing better
     than you ever have - so it must not cover the board. A ring around the
     edge does the alerting: peripheral vision is far better at motion than
     at reading, and your eyes are locked on the snake. The board itself
     stays completely clear. */
  @keyframes promote-ring {
    0%   { box-shadow: 0 0 0 0 var(--belt), 0 0 0 0 rgba(0,0,0,0); }
    35%  { box-shadow: 0 0 0 5px var(--belt), 0 0 34px 6px var(--belt); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0), 0 0 0 0 rgba(0,0,0,0); }
  }
  .stage.promoting canvas {
    border-color: var(--belt);
    animation: promote-ring 1400ms ease-out forwards;
  }

  /* The words go BELOW the board, in the line the controls hint already
     occupies, so nothing reflows and nothing is covered. The score popup
     lives above the board, so a +5 and a promotion on the same move can
     never collide. */
  .hint.promoting {
    color: var(--belt);
    font-weight: bold;
    letter-spacing: 3px;
  }

  /* Motion has to have a way out. The ring is the part that moves; the
     colour change stays, so the moment still reads without animating.
     Doing this properly across the whole game is its own issue. */
  @media (prefers-reduced-motion: reduce) {
    .stage.promoting canvas { animation: none; box-shadow: 0 0 0 4px var(--belt); }

    /* The slab keeps its edge and its travel - those are not motion, they
       are what makes it look pressable. Only the pulse stops. */
    button { animation: none; }
  }

  .version {
    margin: 8px 0 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #4b4652;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Strike First</h1>
    <div class="scores">
      <!-- Live: these move while you play. -->
      <div class="group">
        <span>score <b id="score">0</b></span>
        <span>level <b id="level">1</b></span>
      </div>

      <!-- Standing: these are what you hold, and a run cannot take them away. -->
      <div class="group">
        <span>hi-score <b id="best">0</b></span>
        <span class="rank">belt <i class="belt-swatch" id="best-belt"></i><em id="best-belt-name"></em></span>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="630" height="630"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Strike hard. No mercy.</h2>
      <p  id="overlay-text">arrows or wasd to move</p>
      <button id="play-btn">Enter the dojo</button>
    </div>
  </div>

  <p class="hint" id="hint">arrows / wasd &middot; space = mercy &middot; r = restart</p>
  <p class="version" id="version"></p>
</div>

<script>
// =====================================================================
//  1. SETUP - grab the canvas and work out the size of the grid
// =====================================================================
// A canvas is just a rectangle of pixels we can draw on. "ctx" (context)
// is the paintbrush: every shape we draw goes through it.
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

// The whole game happens on a grid of squares, not on free pixels.
// That makes collisions easy: two things collide if their x/y match.
const CELL = 30;                      // one grid square = 30 pixels
const COLS = canvas.width  / CELL;    // 21 columns across
const ROWS = canvas.height / CELL;    // 21 rows down

// Handy references to the bits of HTML we update as the game runs.
// Single source of truth for the version. Bump this, add a CHANGELOG entry
// and tag the commit - those three go together, always.
const VERSION = '0.3.0';
document.getElementById('version').textContent = 'v' + VERSION;

const scoreEl   = document.getElementById('score');
const levelEl   = document.getElementById('level');
const bestEl    = document.getElementById('best');
const overlay   = document.getElementById('overlay');
const titleEl   = document.getElementById('overlay-title');
const textEl    = document.getElementById('overlay-text');
const bestBeltEl = document.getElementById('best-belt');
const bestNameEl = document.getElementById('best-belt-name');
const stageEl   = document.getElementById('stage');
const hintEl    = document.getElementById('hint');
const HINT_TEXT = hintEl.textContent;

// Asked once and kept, so anything that moves can check it cheaply. The
// game honours this in CSS too; doing it properly everywhere is UNR-104.
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');
const playBtn   = document.getElementById('play-btn');


// =====================================================================
//  2. STATE - every fact the game needs to remember
// =====================================================================
// If you can describe all of these, you can describe the game exactly as
// it looks at this instant. That is all "game state" means.
let snake;          // list of squares, snake[0] is the head
let direction;      // the way we ARE moving, e.g. {x:1, y:0} is right
let turnQueue;      // turns asked for but not made yet, soonest first
let egg;            // the baseline food. There is always exactly one.
let visitor;        // the second slot: a mouse or a rotten egg, or null
let grow;           // squares still owed to the snake from something eaten
let queasy;         // moves left of looking green, after a rotten egg
let bestAtStart;    // the record as it stood when this run began
let score;
let phase;          // 'ready' | 'playing' | 'paused' | 'over'

// Three foods filling three roles, and no more. The EGG is the baseline:
// always there, low value, no cost. The MOUSE is the temptation: worth
// five times as much, but it expires and it costs you extra length. The
// ROTTEN egg is the hazard: it takes points off you.
//
// Only ever two things on the board - the egg, plus at most one visitor.
// That's enforced by there being a single `visitor` slot rather than by
// anyone remembering the rule, and it keeps every decision binary: the
// egg, or the other thing. That's all you can answer at 70ms a move.
const EGG_POINTS    = 1;
const MOUSE_POINTS  = 5;
const ROTTEN_POINTS = -3;   // worth three eggs, so it stings without ruining a run

const EGG_GROWTH    = 1;
const MOUSE_GROWTH  = 2;    // Settled by play on 8 September. The whole point
                            // is that a mouse costs you something: five points
                            // for two squares is a real decision late in a run
                            // rather than pure upside. See UNR-83.

// How often a visitor turns up, and which kind it is when it does.
const VISITOR_CHANCE = 0.4;  // roughly two eggs in five bring something along
const ROTTEN_SHARE   = 0.4;  // ...and this fraction of those are rotten

// How many of YOUR MOVES a visitor sticks around for.
//
// This was cut to 45 on the arithmetic that the longest crossing is 40
// moves. Playing it showed that was wrong: 40 assumes you spot the thing
// instantly and travel in a straight line, and you do neither. Mice were
// vanishing before there was a fair chance at them.
//
// The timer is no longer what makes a mouse a decision. Reachability is
// guaranteed at spawn instead, so the cost of going for one is the extra
// length it leaves you carrying and the risk of boxing yourself in - not
// whether you happened to notice in time. Missing one should be a
// decision that went wrong, never bad luck.
const MOUSE_LIFE    = 60;
const ROTTEN_LIFE   = 45;
const WARNING_MOVES = 15;   // moves left when a visitor starts flashing

// How far a visitor may spawn from your head, as a fraction of its life.
// The rest of the budget is slack for noticing it and for the fact that
// nobody travels in a straight line.
const REACH_BUDGET  = 0.5;

// How long the snake looks ill after a rotten egg. Counted in YOUR MOVES
// like everything else, so it lasts the same number of decisions at every
// speed and doesn't tick away while the game is paused.
const QUEASY_MOVES  = 14;

// localStorage is the browser's tiny notepad - it survives a refresh.
// Renaming the game shouldn't cost you your record, so we still read the
// old key if the new one isn't there yet.
let best = Number(
  localStorage.getItem('strikeFirstBest') || localStorage.getItem('snakeBest') || 0
);
bestEl.textContent = best;

// Put the game back to its opening position. Called at the start and
// after every game over, so a fresh game is always identical.
function reset() {
  snake         = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  direction     = {x: 1, y: 0};   // heading right
  turnQueue     = [];
  score         = 0;
  grow          = 0;
  // Snapshot, because `best` moves during the run now. Without this there
  // is no way to ask afterwards whether THIS run beat the record.
  bestAtStart   = best;
  queasy        = 0;
  visitor       = null;
  scoreEl.textContent = score;
  levelEl.textContent = levelFor(score);
  placeEgg();
}

// Pick a random square that nothing is sitting on yet. The do/while just
// keeps re-rolling until it finds a free one.
function randomEmptySquare() {
  let spot;
  do {
    spot = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (isOccupied(spot));
  return spot;
}

function isOccupied(spot) {
  if (snake.some(part => part.x === spot.x && part.y === spot.y)) return true;
  if (egg     && egg.x     === spot.x && egg.y     === spot.y) return true;
  if (visitor && visitor.x === spot.x && visitor.y === spot.y) return true;
  return false;
}

// Pick a free square close enough that the snake could actually get there
// before the visitor leaves. A mouse parked in the far corner isn't a
// decision, it's a tease; and a rotten egg out there is neither a threat
// nor a choice. Either way the slot is wasted.
function reachableSquare(life) {
  const head   = snake[0];
  const budget = Math.floor(life * REACH_BUDGET);
  for (let tries = 0; tries < 200; tries++) {
    const spot = randomEmptySquare();
    const steps = Math.abs(spot.x - head.x) + Math.abs(spot.y - head.y);
    if (steps <= budget) return spot;
  }
  return randomEmptySquare();   // give up rather than spin forever
}

function placeEgg() {
  egg = null;                     // clear it first so it can't block itself
  egg = randomEmptySquare();
}

// Called after every egg. Most of the time nothing happens - that's what
// makes a visitor feel like an event rather than a routine.
//
// There is only one slot, so a mouse and a rotten egg can never be out at
// the same time. Every arrival is therefore the same question: is that
// worth going for, or is it going to cost me? You have to look, and
// looking away from your own head is itself the risk.
function maybeSpawnVisitor() {
  if (visitor) return;                          // the slot is taken
  if (Math.random() > VISITOR_CHANCE) return;

  const rotten = Math.random() < ROTTEN_SHARE;
  const life   = rotten ? ROTTEN_LIFE : MOUSE_LIFE;
  const spot   = reachableSquare(life);
  visitor = {
    kind:   rotten ? 'rotten' : 'mouse',
    x:      spot.x,
    y:      spot.y,
    life:   rotten ? ROTTEN_LIFE : MOUSE_LIFE,
    facing: Math.random() < 0.5 ? 1 : -1        // which way it happens to sit
  };
}


// =====================================================================
//  3. UPDATE - move the world forward by exactly one step
// =====================================================================
function update() {
  // Take the next turn the player asked for, if there's one waiting. Turns
  // are queued rather than overwritten, so a quick two-key corner survives.
  // Exactly one comes off the queue per step, which is what stops a fast
  // double-tap folding the snake back on itself.
  if (turnQueue.length) direction = turnQueue.shift();

  // The mouse is on a countdown, measured in your moves rather than in
  // seconds. That keeps it just as catchable at top speed as at level 1,
  // and means it doesn't quietly escape while the game is paused.
  if (queasy > 0) queasy -= 1;

  if (visitor) {
    visitor.life -= 1;
    if (visitor.life <= 0) visitor = null;   // it got bored, or it went off
  }

  // The new head is the old head, one square along in our direction.
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Did we hit a wall?
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver('wall');
  }

  // Did we hit ourselves? .some() asks "is ANY body part on this square?"
  if (snake.some(part => part.x === head.x && part.y === head.y)) {
    return gameOver('self');
  }

  // Move: add the new head to the front of the list...
  snake.unshift(head);

  // Did we land on anything? Only one of these can be true, since nothing
  // is ever placed on a square something else already occupies.
  if (head.x === egg.x && head.y === egg.y) {
    addScore(EGG_POINTS, 'egg');
    grow += EGG_GROWTH;
    placeEgg();
    maybeSpawnVisitor();        // an egg sometimes brings something with it
  } else if (visitor && head.x === visitor.x && head.y === visitor.y) {
    if (visitor.kind === 'mouse') {
      addScore(MOUSE_POINTS, 'mouse');
      grow += MOUSE_GROWTH;     // the cost: worth five, but you carry two
    } else {
      addScore(ROTTEN_POINTS, 'rotten');
      queasy = QUEASY_MOVES;    // and you have to watch yourself regret it
      // Deliberately no length change. Taking length OFF would be a
      // *relief* late in a run, which is the opposite of a punishment.
    }
    visitor = null;
  }

  // Growing is just skipping the tail removal. `grow` is how many squares
  // we still owe the snake, so a mouse worth two lengthens it over two
  // steps rather than needing a special case.
  if (grow > 0) grow -= 1;
  else snake.pop();
}

// Every point in the game goes through here, so the feedback can never
// get out of step with the number.
function addScore(points, kind) {
  // Floored at zero. A negative score would read as broken, and belt
  // thresholds are all defined upwards from nothing.
  score = Math.max(0, score + points);
  scoreEl.textContent = score;
  levelEl.textContent = levelFor(score);

  // Rank moves the INSTANT you pass your own record, not when you die.
  // That is what lets a promotion land mid-run, which is the entire point
  // of it: you are still holding the controller, still trying not to die,
  // and the game tells you that you have never been this good. Working it
  // out at gameOver() meant you found out afterwards, which is no moment
  // at all.
  //
  // Order matters here. promotionFor() is asked BEFORE best moves, because
  // the question is whether this point crossed a threshold the old best
  // had not. Afterwards the answer would always be no.
  if (score > best) {
    const earned = promotionFor(best, score);
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('strikeFirstBest', best);
    showBestBelt();
    if (earned) promote(earned);
  }

  // Restart the squash animation. Removing the class isn't enough on its
  // own - the browser batches up our changes and sees no difference.
  // Reading offsetWidth forces it to catch up, so the animation re-runs.
  scoreEl.classList.remove('bump');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('bump');

  // The sign decides the colour, so red can never turn up on a gain by
  // accident - the rule is enforced here rather than left to whoever
  // adds the next food type.
  const pop = document.createElement('div');
  pop.className = 'score-pop'
                + (kind === 'mouse'  ? ' big'   : '')
                + (points < 0        ? ' minus' : '');
  pop.textContent = (points < 0 ? '−' : '+') + Math.abs(points);
  scoreEl.parentElement.appendChild(pop);

  // CSS handles the drifting and fading; we just clear up afterwards.
  setTimeout(() => pop.remove(), 900);
}

function gameOver(cause) {
  phase = 'over';

  // `best` is not touched here any more. It moves the moment you pass it,
  // inside addScore(), which is what lets the promotion land while you are
  // still playing. By the time you die it is already correct.

  // This screen says one thing: you lost. A promotion is a separate
  // moment and putting it here made the screen argue with itself -
  // "DEFEATED" and "PROMOTED" are not the same news and should not
  // share a slot. The promotion lands on its own, mid-run, which is
  // where it belongs and what makes it worth having. See UNR-81.
  // The score is not repeated here - it is still sitting in the header
  // where you have been watching it all run. This screen gets one thing
  // to say, so it may as well be worth reading.
  showOverlay(
    'DEFEATED',
    defeatLine(cause, score, score > bestAtStart, Math.random()),
    'Again'
  );
}


// =====================================================================
//  4. DRAW - paint the current state onto the canvas
// =====================================================================
// Note that drawing never CHANGES anything. It only shows what update()
// already decided. Keeping those two jobs separate keeps games sane.
function draw() {
  // Wipe the previous frame, otherwise we'd smear trails everywhere.
  ctx.fillStyle = '#131316';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Faint dot in the middle of each grid square, just for looks.
  ctx.fillStyle = '#1e1e24';
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
    }
  }

  // The egg, with a gentle pulse driven by the clock.
  const pulse = 1 + Math.sin(Date.now() / 200) * 0.10;
  drawEgg(egg.x * CELL + CELL / 2, egg.y * CELL + CELL / 2, pulse);

  if (visitor) {
    // Flash when it's nearly out of time, so you get fair warning either
    // way: that a mouse is about to bolt, or that a rotten one is about
    // to stop being your problem.
    const panicking = visitor.life < WARNING_MOVES;
    if (!(panicking && Math.floor(Date.now() / 140) % 2 === 0)) {
      if (visitor.kind === 'mouse') drawMouse();
      else                          drawRottenEgg();
    }
  }

  drawSnake();
}

// How much bigger than the authored artwork each one is drawn, and where
// its true centre sits inside the 20x20 box. Balance lives in constants.
// THE HEAD IS THE EXCEPTION TO ONE CELL, AND ALWAYS HAS BEEN.
//
// The hood is 26px wide and the tongue reaches well past the head. They
// have never fitted inside a 20px square and they are not meant to - a
// cobra that fits neatly in its own cell does not look like a cobra.
//
// So the head artwork is authored inside a 20x20 box, normalised by
// 1/1.8, and scaled back up here. Drawing it unscaled shrinks the head to
// something meek. See design/ASSET-BRIEF.md section 7.
// The artwork and the hand-drawn effects were all authored for a 20px
// cell. This is what lets the cell size change without every number in
// the drawing code being wrong.
//
// Getting this wrong is not subtle but it is easy: scaling the sprites
// and forgetting the effects hid the rotten egg's fumes completely
// inside a shell that had grown around them.
const CELL_SCALE = CELL / 20;

const HEAD_SCALE = 1.8;

// How wide the tail artwork actually is inside its box, which is not the
// box. Measured, not guessed.
const TAIL_ART_WIDTH = 11.3;

const SPRITE_SIZE = {
  egg:       { scale: 1.35, cx: 10.0, cy: 10.0 },
  rottenEgg: { scale: 1.45, cx: 10.5, cy: 11.2 },
  mouse:     { scale: 1.25, cx:  9.4, cy: 10.4 }
};

// Turn the authored paths into Path2D once, at load. These are painted
// sixty times a second and reparsing a path string that often is waste.
for (const name of Object.keys(SPRITE)) {
  for (const layer of SPRITE[name]) layer.path = new Path2D(layer.d);
}

// Paint a sprite centred on a cell. `extra` multiplies the sprite's own
// scale, which is how the egg's pulse rides on top of its base size.
function drawSprite(name, cx, cy, extra) {
  const size = SPRITE_SIZE[name];
  const k = size.scale * (extra || 1) * CELL_SCALE;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.translate(-size.cx, -size.cy);
  for (const layer of SPRITE[name]) {
    ctx.fillStyle = layer.fill;
    ctx.fill(layer.path);
  }
  ctx.restore();
}


// ---- the egg ----------------------------------------------------------
// Cobras raid nests; they don't eat fruit.
//
// THE WARM SHELL AND THE GOLD RIM ARE LOAD-BEARING. The drawn artwork
// arrived filled with bone - the exact colour of the snake - and at cell
// size the egg became indistinguishable from a body segment. The snake is
// most of what moves on this board, so the baseline food must never read
// as a piece of it. The shape is the artwork's; the colour is not.
function drawEgg(cx, cy, pulse) {
  drawSprite('egg', cx, cy, pulse);

  // The rim, which is what says "worth eating" - the rotten egg
  // deliberately has a dull dark one instead, and that contrast does as
  // much work as the shape difference.
  const k = SPRITE_SIZE.egg.scale * pulse * CELL_SCALE;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(k, k);
  ctx.translate(-SPRITE_SIZE.egg.cx, -SPRITE_SIZE.egg.cy);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth   = 1.1 / k;   // constant on screen, whatever the scale
  ctx.stroke(SPRITE.egg[0].path);
  ctx.restore();
}


// ---- the rotten egg ---------------------------------------------------
// The hazard. It reuses the egg's vocabulary on purpose - you already know
// an egg is good, so an egg that looks WRONG needs no explaining.
//
// The difference has to survive without colour. The shell is tipped over
// and cracked open, and a good egg stands upright, so the silhouette
// alone tells you something is wrong before you have registered the hue.
// A player who cannot see the green still sees a broken, leaning egg.
function drawRottenEgg() {
  const cx = visitor.x * CELL + CELL / 2;
  const cy = visitor.y * CELL + CELL / 2;

  // A stream of fumes coming off it. Three puffs on staggered phases, each
  // rising, swelling and fading, so it reads as a continuous emission
  // rather than three blobs. Drawn first so the shell sits on top.
  //
  // This stays as code rather than becoming artwork. It is the bit that
  // makes the thing FINDABLE: on a near-black board a dull shape
  // disappears, but movement does not, and it catches the eye well before
  // you have consciously identified what it is. A static contour cannot
  // do that job.
  for (let i = 0; i < 3; i++) {
    const phase = ((Date.now() / 1100) + i / 3) % 1;
    const rise  = (5.5 + phase * 9)   * CELL_SCALE;
    const wob   = Math.sin(phase * 5 + i * 2) * 2.2 * CELL_SCALE;
    ctx.fillStyle = `rgba(178, 214, 92, ${0.42 * (1 - phase)})`;
    circle(cx + wob, cy - rise, (1.6 + phase * 2.6) * CELL_SCALE);
  }

  // A soft halo, so the shell itself lifts off the dark board. Kept tight:
  // a wide one becomes the thing your eye measures and makes the shell
  // look smaller than the egg it is supposed to rhyme with.
  ctx.fillStyle = 'rgba(163, 201, 74, 0.11)';
  circle(cx, cy + CELL_SCALE, 7.5 * CELL_SCALE);

  // The tilt is already baked into these coordinates. Rotating here would
  // apply it twice.
  drawSprite('rottenEgg', cx, cy);
}


// ---- the mouse --------------------------------------------------------
// The temptation. Warmer than the egg on purpose - it is worth five times
// as much, so it should catch the eye - and it faces the way it is going.
function drawMouse() {
  const cx = visitor.x * CELL + CELL / 2;
  const cy = visitor.y * CELL + CELL / 2;

  // The artwork is drawn facing right, so facing left is a mirror about
  // the centre of the cell rather than a second set of paths.
  const size = SPRITE_SIZE.mouse;
  ctx.save();
  ctx.translate(cx, cy);
  const m = size.scale * CELL_SCALE;
  ctx.scale(m * visitor.facing, m);   // facing -1 mirrors it
  ctx.translate(-size.cx, -size.cy);
  for (const layer of SPRITE.mouse) {
    ctx.fillStyle = layer.fill;
    ctx.fill(layer.path);
  }
  ctx.restore();
}


// ---- the snake --------------------------------------------------------
// Drawn tail-first, so the head always ends up painted on top.
function drawSnake() {
  for (let i = snake.length - 1; i >= 1; i--) {
    // t runs from 0 (just behind the head) to 1 (the very tip of the tail).
    // Everything below is just "make it smaller and darker as t grows",
    // which is what turns a row of identical blocks into a real tail.
    const t = i / (snake.length - 1);

    const size  = (CELL - 2) - t * 7;   // segments shrink toward the tip
    const inset = (CELL - size) / 2;    // keeps each one centred in its square

    const radius = size / 3;

    // The very tip is a drawn point rather than a rounded square, and it
    // trails whichever way the body actually runs.
    if (i === snake.length - 1 && snake.length > 1) {
      drawTailTip(i, size);
      continue;
    }

    // Bone white at the shoulders, fading to a dusty grey at the tip -
    // except for the one segment wearing the belt, which is the rank you
    // hold. A belt is a band around a body, so it needs no explaining.
    //
    // At white belt the band is bone, so it blends into the shoulders and
    // there is visibly no belt yet. That is correct: the first coloured
    // band you ever see is the moment you were promoted off white.
    //
    // The band deliberately does NOT drain when the snake is unwell. Rank
    // and condition are separate facts on separate surfaces: the whole
    // body says how you are, the one band says who you are, and being
    // sick has never cost anybody their belt.
    ctx.fillStyle = (i === BELT_SEGMENT)
      ? BELTS[beltFor(best) - 1].colour
      : bodyColour(t, queasiness());
    roundedSquare(
      snake[i].x * CELL + inset,
      snake[i].y * CELL + inset,
      size,
      radius
    );
  }

  drawHead();
}

// The pointed tip. The artwork points LEFT, so it is turned to face away
// from the segment in front of it - the tail should trail the body rather
// than always pointing the same way regardless of where the snake went.
function drawTailTip(i, size) {
  const tip  = snake[i];
  const prev = snake[i - 1];

  // From the segment ahead of the tip, back to the tip itself. That is
  // the direction the tail is pointing.
  const angle = Math.atan2(tip.y - prev.y, tip.x - prev.x);

  // The artwork is about 11 units across inside its 20px box, so scaling
  // by the box would have drawn it two thirds the size it should be. This
  // scales against the ARTWORK, and finishes a little proud of the last
  // full segment so the tail ends in a point rather than a pip.
  const k = (size + 2) / TAIL_ART_WIDTH;
  ctx.save();
  ctx.translate(tip.x * CELL + CELL / 2, tip.y * CELL + CELL / 2);
  ctx.rotate(angle + Math.PI);      // artwork points left; turn it to trail
  ctx.scale(k, k);
  ctx.translate(-10, -10);
  ctx.fillStyle = bodyColour(1, queasiness());
  ctx.fill(SPRITE.tail[0].path);
  ctx.restore();
}

// The head is where all the personality lives: it faces the way you're
// travelling, blinks, flicks its tongue, and gets X eyes when you crash.
function drawHead() {
  const head = snake[0];

  // The whole head is painted around cx/cy, so shifting them shudders the
  // hood, eyes, markings and tongue together as one thing.
  //
  // Skipped entirely when the player has asked for reduced motion. A
  // shiver is exactly the kind of small high-frequency movement that
  // makes people with vestibular sensitivity feel ill, and giving someone
  // motion sickness to convey nausea is a poor trade. They still get the
  // tongue, which stays out the whole time you are queasy.
  const shake = REDUCED_MOTION.matches
    ? { x: 0, y: 0 }
    : queasyShake(queasiness(), Date.now());

  const cx = head.x * CELL + CELL / 2 + shake.x;
  const cy = head.y * CELL + CELL / 2 + shake.y;

  // "fwd" is the way we're heading. "side" is that turned 90 degrees, so
  // it points out of the snake's cheeks.
  const fwd  = direction;
  const side = { x: -direction.y, y: direction.x };

  // Rotating the whole canvas is far easier than working out the maths
  // for artwork pointing in four different directions: we spin the paper,
  // draw the head facing right, then spin the paper back.
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.atan2(fwd.y, fwd.x));
  ctx.scale(HEAD_SCALE * CELL_SCALE, HEAD_SCALE * CELL_SCALE);
  ctx.translate(-10, -10);

  paintHead(SPRITE.headBefore);

  // The eyes are three different things wearing the same socket: open,
  // shut for a moment, or crossed out because you crashed.
  if (phase === 'over')                paintHead(SPRITE.headEyesDefeated);
  else if (Date.now() % 4200 < 130)    paintHead(SPRITE.headEyesBlink);
  else                                 paintHead(SPRITE.headEyesOpen);

  paintHead(SPRITE.headAfter);
  ctx.restore();

  // Tongue flicks every couple of seconds - and stays out the whole time
  // there's something worth eating directly ahead, because the snake gets
  // excited. Not for a rotten egg. It doesn't want that one either.
  //
  // Drawn in the game's own coordinates rather than as artwork, because
  // it has to animate. The supplied tongue path is a static outline and
  // cannot flick.
  const ahead = { x: head.x + fwd.x, y: head.y + fwd.y };
  const treatAhead =
       (egg.x === ahead.x && egg.y === ahead.y)
    || (visitor && visitor.kind === 'mouse'
        && visitor.x === ahead.x && visitor.y === ahead.y);
  if (phase === 'playing' && (treatAhead || queasy > 0 || Date.now() % 2600 < 280)) {
    drawTongue(cx, cy, fwd, side);
  }
}

// Fill a group of head paths, greening the fleshy ones if the snake has
// eaten something rotten. The markings, eyes and nostrils never take the
// tint - a sick snake should look sick, not repainted.
function paintHead(layers) {
  const sick = queasiness();
  for (const layer of layers) {
    ctx.fillStyle = (layer.tint && sick > 0)
      ? mixColour(hexToRgb(layer.fill), SICK_GREEN, sick * 0.85)
      : layer.fill;
    ctx.fill(layer.path);
  }
}

// '#rrggbb' to [r, g, b], so authored fills can be blended with the same
// mixColour the rest of the drawing uses.
function hexToRgb(hex) {
  return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
}

function drawTongue(cx, cy, fwd, side) {
  const baseX = cx + fwd.x * (CELL / 2 - 2);
  const baseY = cy + fwd.y * (CELL / 2 - 2);
  const tipX  = baseX + fwd.x * 6;
  const tipY  = baseY + fwd.y * 6;

  ctx.strokeStyle = '#d3262f';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.lineTo(tipX, tipY);
  // the two prongs of the fork
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX + fwd.x * 3 + side.x * 2.5, tipY + fwd.y * 3 + side.y * 2.5);
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX + fwd.x * 3 - side.x * 2.5, tipY + fwd.y * 3 - side.y * 2.5);
  ctx.stroke();
}


// ---- small drawing helpers, so the code above stays readable ----------
function roundedSquare(x, y, size, radius) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, size, size, radius);
  else               ctx.rect(x, y, size, size);
  ctx.fill();
}

function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function strokeLine(x1, y1, x2, y2, colour, width) {
  ctx.strokeStyle = colour;
  ctx.lineWidth   = width;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawCross(x, y) {
  strokeLine(x - 2, y - 2, x + 2, y + 2, '#09090b', 1.6);
  strokeLine(x + 2, y - 2, x - 2, y + 2, '#09090b', 1.6);
}

// What a snake that has just eaten something it regrets looks like.
// HOW CONDITION IS SHOWN, AND WHY IT MAY USE COLOUR AFTER ALL.
//
// The original sick green was rejected because green is the third belt,
// so being unwell collided with rank. Then ash was rejected because a
// grey snake is a dull snake and the game is black-and-gold for a reason.
//
// The green is back, and the first objection turns out not to hold any
// more. It was written when the WHOLE snake was going to carry the belt
// colour - at green belt a green snake really did say nothing. But rank
// moved onto a single band, so the body's baseline is bone at every rank,
// and bone turning green reads exactly the same whatever belt you hold.
//
// So the rule is narrower than it looked: THE BAND owns rank colour, and
// the body is free to use colour for condition because its baseline is
// never a belt colour. The one cost is that at green belt the band blends
// into a queasy body for a few moves. That is a fair trade - condition is
// temporary and urgent, rank is permanent and also in the header, so
// briefly losing sight of your belt costs far less than missing the fact
// that you just ate something rotten.
const SICK_GREEN = [138, 190, 64];

// The body's own two ends.
const BONE_BODY  = [232, 226, 214];   // bright at the shoulders
const DUSTY_TAIL = [124, 118, 108];   // dusty at the tip

// The colour of one body segment. `t` runs 0 at the shoulders to 1 at the
// tip; `sick` runs 0 (well) to 1 (just ate a rotten egg).
//
// The whole body carries it now, not just the head as it did originally.
// That is the real reason the first version was easy to miss: one square
// changing colour at the far end of a moving snake is nothing.
function bodyColour(t, sick) {
  return mixColour(blend(BONE_BODY, DUSTY_TAIL, t), SICK_GREEN, sick * 0.8);
}

// The shudder, as an offset in pixels. Two different frequencies so it
// wobbles rather than sliding along one line, which reads as a shiver
// instead of a drift.
//
// PURELY VISUAL. The snake still occupies exactly the square it occupies;
// this only moves where the head is painted. draw() never changes what is
// true - that is update()'s job, and mixing the two is how games rot.
function queasyShake(sick, now) {
  if (sick <= 0) return { x: 0, y: 0 };
  const amp = QUEASY_SHAKE * sick;
  return { x: Math.sin(now / 18) * amp, y: Math.cos(now / 13) * amp };
}

// 1 immediately after a rotten egg, fading to 0 as it wears off. Used to
// tint the head, so you watch yourself regret it rather than just seeing
// a number go down.
function queasiness() {
  return queasy / QUEASY_MOVES;
}

// Blend two colours together. t=0 gives the first, t=1 gives the second,
// and anything between gives a mix - that's the fade along the tail.
// `blend` hands back the channels so mixes can be composed; mixColour
// wraps it for anything going straight into a fillStyle.
function blend(from, to, t) {
  return from.map((channel, i) =>
    Math.round(channel + (to[i] - channel) * t)
  );
}

function mixColour(from, to, t) {
  return 'rgb(' + blend(from, to, t).join(',') + ')';
}


// =====================================================================
//  5. THE GAME LOOP - the heartbeat
// =====================================================================
// Every game ever made is some version of: update, draw, wait, repeat.
// The loop runs forever; update() only actually runs while we're playing,
// which is what makes pausing and the menus work.
function loop() {
  if (phase === 'playing') update();
  draw();
  setTimeout(loop, stepDelay());
}

// Difficulty within a run, as tiers rather than a smooth slope.
//
// This used to shave 4ms off per point, continuously. It worked, but it
// was invisible: every run felt like the same gradient and nothing ever
// happened. Steps give a run a rhythm - settle in, master a pace, get
// pushed - and give you something to notice that isn't the score.
//
// A level is within a run and resets when you die. A belt is across runs
// and is a rank you hold. They are different things and they live in
// different places: the level in the header, the belt on the snake.
//
// Level 1 opened at 200ms and playing it showed that was too brisk to
// start, especially now there are three things on the board to read
// rather than two. It opens slower and takes longer to bite.
const LEVELS = [
  { from:   0, ms: 260 },   // 1 - unhurried, room to think
  { from:   8, ms: 225 },
  { from:  18, ms: 195 },
  { from:  30, ms: 170 },
  { from:  45, ms: 145 },
  { from:  65, ms: 120 },
  { from:  90, ms: 100 },
  { from: 120, ms:  85 },
  { from: 155, ms:  70 }    // 9 - the floor. Nothing gets faster than this.
];

// Takes a score, returns a level. Pure: it reads nothing and changes
// nothing, which is why it needs no scaffolding to test.
function levelFor(points) {
  let level = 1;
  for (let i = 0; i < LEVELS.length; i++) {
    if (points >= LEVELS[i].from) level = i + 1;
  }
  return level;
}

function stepDelay() {
  return LEVELS[levelFor(score) - 1].ms;
}


// =====================================================================
//  BELTS - rank across runs
// =====================================================================
// A belt is a rank you HOLD, and it is what unlocks things later. An
// unlock has to survive a death to mean anything, which is why rank
// persists and difficulty does not.
//
// Rank comes from your BEST score ever, never the run you are in. That
// is the whole mechanism: you are promoted only by beating your own
// record, and only by beating it enough to cross a threshold. A small
// personal best doesn't promote you. A breakthrough does. It also means
// you can't climb three belts in one sitting unless you have far
// exceeded anything you have ever done - in which case you earned all
// three.
//
// One consequence worth keeping: because rank is fixed while you play,
// it doesn't flicker through three belts during a run. The exception is
// the breakthrough, where the promotion lands live, mid-run, while you
// are still trying not to die. Rare, and the best moment the game has.
//
// The ladder is the real Tang Soo Do progression rather than a generic
// karate one. No yellow, no purple. Red sits near the TOP, after brown,
// which inverts what most people expect. The last belt is midnight blue
// rather than black, because black symbolises an end and the idea is
// that learning never stops - Cho Dan Bo means black belt candidate.
//
// Colours are lifted off their real-world equivalents to stay legible on
// a near-black board. Brown and midnight blue are the two that needed it
// most. Rank is never carried by colour alone - the belt's NAME is shown
// alongside it - because seven hues cannot be told apart under a colour
// vision deficiency, and because the board is dark.
//
// THRESHOLDS ARE A STARTING SHAPE, to be corrected by play. The first
// gap is the one that matters: every player experiences white to orange
// and progressively fewer see each rank after it, so it is the
// highest-traffic decision on the whole ladder. Nobody has watched a new
// player score anything yet, so 15 is a compromise between "meet the
// mechanic before you stop playing" and "make it feel earned", not a
// finding. If new players bounce off it, lower it - that is a one-line
// change and there is no cost to being wrong in that direction.
// Which segment carries the band. Never 0 - that's the head, and the head
// already carries direction, eyes, blinking, the tongue and the X on
// defeat. One behind it reads as a collar and is always present, since the
// snake is three segments long before it has eaten anything.
const BELT_SEGMENT = 1;

// How far the head shivers when the snake is queasy, in pixels at full
// nausea. Small: it has to read as a shudder without making the head hard
// to aim. Cells are 20px, so this stays well inside one square.
const QUEASY_SHAKE = 3.2;

// DEFEAT LINES.
//
// The dojo voice: no contractions, second person, eight words at most,
// full stops even on fragments, never an exclamation mark, nine words
// at most. See
// design/MICROCOPY.md - that file is the authority, this is just where
// the strings live.
//
// Grouped by how you died, because a line that names your actual mistake
// is worth three generic ones. The game already knows: it can only ever
// be a wall or your own tail.
//
// `record` outranks everything. Somebody who has just beaten their own
// best deserves acknowledgement rather than a joke at their expense - the
// dojo is harsh, not cruel.
const DEFEAT_LINES = {
  wall: [
    'The wall does not move. You do.',
    'Fear does not exist in this dojo. Walls do.',
    'You found the edge of the mat.',
    'Straight lines are not a strategy.',
    'No mercy from the wall either.'
  ],
  self: [
    'You struck first. At yourself.',
    'The enemy was you. It usually is.',
    'A cobra that bites itself learns twice.',
    'Even a cobra cannot swallow all of itself.',
    'Turn earlier. That is the entire lesson.'
  ],
  nothing: [
    'Not one thing. Not one.',
    'The dojo will pretend it did not see that.',
    'This is a karate game, not a standing-still game.'
  ],
  record: [
    'Better than you have ever been. Still dead.',
    'A record and a corpse.',
    'You have never done that before. Do it again.'
  ]
};

// Pick the line. `roll` is a number from 0 up to 1 - passed in rather than
// rolled in here, so this takes arguments and returns an answer and needs
// no scaffolding to test.
function defeatLine(cause, points, isRecord, roll) {
  const pool = isRecord      ? DEFEAT_LINES.record
             : points === 0  ? DEFEAT_LINES.nothing
             : DEFEAT_LINES[cause] || DEFEAT_LINES.wall;
  return pool[Math.min(pool.length - 1, Math.floor(roll * pool.length))];
}

// How long the promotion moment lasts. Long enough to read without
// pausing, short enough that it is over before it costs you the run.
const PROMOTION_MS = 1400;

const BELTS = [
  { name: 'White',         colour: '#e8e2d6', from:   0 },
  { name: 'Orange',        colour: '#f4761c', from:  15 },
  { name: 'Green',         colour: '#46a86c', from:  35 },
  { name: 'Brown',         colour: '#9c6438', from:  65 },
  { name: 'Red',           colour: '#d3262f', from: 110 },
  { name: 'Cho Dan Bo',    colour: '#3f7fd0', from: 175 },
  { name: 'Midnight blue', colour: '#324791', from: 275 }
];

// Takes a best score, returns the rank held as a 1-based number - the
// same shape as levelFor, so BELTS[beltFor(x) - 1] gets you the belt.
// Pure: it reads nothing and changes nothing.
function beltFor(points) {
  let rank = 1;
  for (let i = 0; i < BELTS.length; i++) {
    if (points >= BELTS[i].from) rank = i + 1;
  }
  return rank;
}

// Did going from one best score to another earn a belt? Returns the belt
// just reached, or null.
//
// NOT CALLED YET. This is the seam the promotion moment plugs into, and
// it is deliberately not wired to the defeat screen - see gameOver(). It
// is tested, so whoever builds UNR-81 inherits a settled answer to "was
// that a promotion?" rather than deriving it again.
//
// The first line is the rule that keeps rank honest: a score that isn't a
// personal best can never promote you, however high it is. Everything
// else is just asking whether the two scores sit in different bands.
function promotionFor(oldBest, newBest) {
  if (newBest <= oldBest) return null;
  const earned = beltFor(newBest);
  return earned > beltFor(oldBest) ? BELTS[earned - 1] : null;
}


// =====================================================================
//  6. INPUT - turn key presses into intentions
// =====================================================================
// How many turns to remember while waiting for the next step. Two is enough
// to round a corner with a quick double-tap. More and the snake starts to
// feel like it's driving itself rather than answering you.
const TURN_QUEUE_MAX = 2;

const KEYS = {
  ArrowUp:    {x:  0, y: -1},
  ArrowDown:  {x:  0, y:  1},
  ArrowLeft:  {x: -1, y:  0},
  ArrowRight: {x:  1, y:  0},
  w: {x: 0, y: -1}, s: {x: 0, y:  1},
  a: {x: -1, y: 0}, d: {x: 1, y:  0}
};

document.addEventListener('keydown', (event) => {
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;

  // Stop arrows and space from scrolling the page underneath us.
  if (key in KEYS || key === ' ') event.preventDefault();

  if (key === 'r') { startGame(); return; }

  if (key === ' ') {
    if (phase === 'playing') {
      phase = 'paused';
      showOverlay('MERCY', 'Press space to fight on', 'Continue');
    } else if (phase === 'paused') {
      phase = 'playing';
      overlay.classList.add('hidden');
    } else {
      startGame();
    }
    return;
  }

  const turn = KEYS[key];
  if (!turn || phase !== 'playing') return;

  // Check the turn against the direction it will ACTUALLY follow: the last
  // one already queued, or the current one if nothing is waiting. Checking
  // against `direction` was the old bug. Heading right, you'd press up then
  // left to round a corner, and the left was thrown away as a U-turn - even
  // though by the time it applied you'd have been heading up, and left would
  // have been fine.
  const after = turnQueue.length ? turnQueue[turnQueue.length - 1] : direction;

  // Refuse a straight U-turn - you'd instantly eat your own neck.
  if (turn.x === -after.x && turn.y === -after.y) return;

  // Ignore a turn that changes nothing, so holding a key can't fill the queue.
  if (turn.x === after.x && turn.y === after.y) return;

  if (turnQueue.length >= TURN_QUEUE_MAX) return;
  turnQueue.push(turn);
});


// =====================================================================
//  7. MENUS + KICKOFF
// =====================================================================
// An overlay says one thing. Rank is not repeated here: it is on the snake
// and named in the header, so saying it a third time was a third voice
// telling you something you already knew. A promotion is the exception,
// and it has its own moment below the board rather than a line in here.
function showOverlay(title, text, buttonLabel) {
  titleEl.textContent = title;
  textEl.textContent  = text;
  playBtn.textContent = buttonLabel;
  overlay.classList.remove('hidden');
}

// You crossed a threshold you had never crossed. Rare - perhaps once in
// twenty runs - so it can afford a real beat rather than a flicker that
// has to get out of its own way.
//
// It fires exactly once per promotion for free, without any bookkeeping:
// `best` has already moved past the threshold by the time this runs, so
// the same rank can never be earned twice. A restart doesn't fire it, and
// neither does re-reaching a rank you already hold.
function promote(belt) {
  // Restarting a CSS animation needs the class off, a forced reflow, then
  // the class back on - the same trick the score counter uses.
  stageEl.classList.remove('promoting');
  void stageEl.offsetWidth;

  stageEl.style.setProperty('--belt', belt.colour);
  hintEl.style.setProperty('--belt', belt.colour);
  hintEl.textContent = belt.name.toUpperCase() + ' BELT';

  stageEl.classList.add('promoting');
  hintEl.classList.add('promoting');

  setTimeout(() => {
    stageEl.classList.remove('promoting');
    hintEl.classList.remove('promoting');
    hintEl.textContent = HINT_TEXT;
  }, PROMOTION_MS);
}

// The header swatch, which is the persistent one. It annotates `hi-score`
// because that score is what produced the rank.
function showBestBelt() {
  const worn = BELTS[beltFor(best) - 1];
  bestBeltEl.style.setProperty('--belt', worn.colour);
  bestBeltEl.title = worn.name + ' belt';
  bestNameEl.textContent = worn.name;
}

function startGame() {
  reset();
  phase = 'playing';
  overlay.classList.add('hidden');
}

playBtn.addEventListener('click', () => {
  if (phase === 'paused') {
    phase = 'playing';
    overlay.classList.add('hidden');
  } else {
    startGame();
  }
});

// Set up an opening position to look at behind the menu, then start the
// heartbeat. Nothing moves until phase becomes 'playing'.
reset();
phase = 'ready';
showBestBelt();
loop();
</script>

</body>
